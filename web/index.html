<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Omni" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg transform='translate(7 9) skewX(-10)'%3E%3Ccircle r='4.5' fill='none' stroke='%230D0D0C' stroke-width='2.4'/%3E%3Ccircle cx='5.9' cy='-5.9' r='1.75' fill='%230D0D0C'/%3E%3C/g%3E%3C/svg%3E" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg transform='translate(7 9) skewX(-10)'%3E%3Ccircle r='4.5' fill='none' stroke='%23ffffff' stroke-width='2.4'/%3E%3Ccircle cx='5.9' cy='-5.9' r='1.75' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('omni.theme') || '"system"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Omni</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
