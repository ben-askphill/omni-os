<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commits by package</title>
<style>
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .tile, .panel { background: var(--card); border-radius: var(--radius); padding: 16px; }
  .label { color: var(--muted-foreground); font-size: 12.5px; }
  .big { font-size: 28px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 10px; height: 26px; }
  .name { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); }
  .bar { height: 12px; border-radius: 0 4px 4px 0; background: var(--chart-1); transition: width .25s; }
  .n { text-align: right; font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 6px; margin-top: 12px; }
  button { font: inherit; font-size: 12.5px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--foreground); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
</style>
</head>
<body>
  <div class="tiles">
    <div class="tile"><div class="label">Commits, last <span id="days">60</span> days</div><div class="big" id="total">442</div></div>
    <div class="tile"><div class="label">Busiest package</div><div class="big" id="top">apps/desktop</div></div>
  </div>
  <div class="panel">
    <h2>Commits touching each package</h2>
    <div id="rows"></div>
    <div class="controls"><button id="d60" aria-pressed="true">60 days</button><button id="d30" aria-pressed="false">30 days</button></div>
  </div>
<script>
  var data = { 60: [['apps/desktop', 146], ['apps/server', 138], ['apps/web', 117], ['apps/mcp', 45], ['packages/shared', 35]],
               30: [['apps/server', 81], ['apps/web', 64], ['apps/desktop', 52], ['packages/shared', 20], ['apps/mcp', 12]] };
  function draw(d) {
    var rows = data[d], max = rows[0][1], total = 0;
    document.getElementById('rows').innerHTML = rows.map(function (r) { total += r[1]; return '<div class="row"><span class="name">' + r[0] + '</span><div class="bar" style="width:' + (100 * r[1] / max) + '%"></div><span class="n">' + r[1] + '</span></div>'; }).join('');
    document.getElementById('days').textContent = d;
    document.getElementById('total').textContent = total;
    document.getElementById('top').textContent = rows[0][0];
    document.getElementById('d60').setAttribute('aria-pressed', d === 60);
    document.getElementById('d30').setAttribute('aria-pressed', d === 30);
  }
  document.getElementById('d60').onclick = function () { draw(60); };
  document.getElementById('d30').onclick = function () { draw(30); };
  draw(60);
</script>
</body>
</html>
