<!-- @dsCard group="02 Color" viewport="700x210" name="Pops — status only" subtitle="Three saturated signals. Each means exactly one thing." width=700 height=210 -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:var(--bg)}code{font:var(--type-meta);color:var(--fg-3)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.b{height:110px;padding:14px 16px;border-radius:22px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}.b b{font:500 20px/1 var(--font-head);letter-spacing:-.01em}.b span{font:var(--type-meta)}.m{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font:400 12.5px/1.4 var(--font-sans);color:var(--fg-2)}.m code{display:block;margin-bottom:2px}</style></head><body>
<div class="g"><div class="b" style="background:var(--ultramarine);color:#fff"><span>--live · #2B3BFF</span><b>Running</b></div><div class="b" style="background:var(--vermilion);color:var(--ink)"><span>--needs · #FF4420</span><b>Needs you</b></div><div class="b" style="background:var(--volt);color:var(--ink)"><span>--done · #C6F52B</span><b>Done</b></div></div>
<div class="m"><div><code>ultramarine</code>Happening right now: a thread, a check, a tool call.</div><div><code>vermilion</code>A decision, a block, an error. The only thing allowed to interrupt.</div><div><code>volt</code>Just finished and unread. Settles to grey once seen.</div></div></body></html>
