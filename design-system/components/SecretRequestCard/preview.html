<!-- @dsCard group="12 Thread" viewport="760x1500" name="SecretRequestCard" subtitle="request_secret: masked field, replace step, settled summaries, phone width" width=760 height=1500 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{padding:20px 24px;background:var(--bg)}.phone{width:390px;margin-top:8px;padding:12px 16px;box-sizing:border-box;border-radius:var(--r-xl);background:var(--bg);box-shadow:var(--shadow-card)}.lab{margin:18px 0 2px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady(({ SecretRequestCard, Message }) => {
const ask = { name: 'STRIPE_TEST_KEY', label: 'Stripe test secret key', scope: 'channel', reason: 'To run the checkout tests' };
function App(){return <div className="om-thread"><div className="om-transcript">
  <Message role="user" time="09:17">Run the checkout tests against Stripe.</Message>
  <SecretRequestCard ask={ask} />
  <div className="om-caption lab">A value is already saved</div>
  <SecretRequestCard exists ask={ask} />
  <div className="om-caption lab">Replace, second press</div>
  <SecretRequestCard exists confirming ask={ask} />
  <div className="om-caption lab">Refused, the typed value stays</div>
  <SecretRequestCard ask={{ ...ask, scope: 'global', reason: null }} error="The thread runs on another machine." />
  <div className="om-caption lab">Saved, replaced, cancelled, not entered</div>
  <SecretRequestCard state="saved" ask={ask} />
  <SecretRequestCard state="saved" replaced ask={{ ...ask, scope: 'global' }} />
  <SecretRequestCard state="cancelled" ask={ask} />
  <SecretRequestCard state="dismissed" ask={ask} />
</div>
<div className="om-caption lab">Phone, 390pt</div>
<div className="phone om-thread"><div className="om-transcript"><SecretRequestCard touch exists ask={ask} /></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
