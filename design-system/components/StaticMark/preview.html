<!-- @dsCard group="01 Logo" name="StaticMark" subtitle="Clean static mark; ring drops the droplet at 16px and below" width=700 height=140 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{padding:20px 24px;background:var(--bg)}.cells{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-end}.cell{display:grid;gap:8px;justify-items:start}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady(({ StaticMark }) => {

function App(){return <div className="cells"><div className="cell"><span className="om-caption">64</span><StaticMark size={64}/></div><div className="cell"><span className="om-caption">32</span><StaticMark size={32}/></div><div className="cell"><span className="om-caption">17</span><StaticMark size={17}/></div><div className="cell"><span className="om-caption">16 ring</span><StaticMark size={16} ring/></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
