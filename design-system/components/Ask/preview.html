<!-- @dsCard group="12 Thread" name="Ask — Ask a crew role from a thread" subtitle="Ask chip over the reply box, @ menu role rows, a sent Ask with its card; light and dark" width=1120 height=700 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--canvas);color:var(--fg);font:var(--type-body)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pane{min-width:0;padding:14px 16px;border-radius:var(--r-2xl);background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line);display:grid;gap:14px}
.pane h3{margin:2px 0 0;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}
.cap{margin:0;font:500 11px/1.3 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3)}
.composer{border-radius:20px;background:var(--surface);overflow:hidden}
.chipcard{margin:8px 8px 0;padding:10px 12px;border-radius:16px;background:var(--bg);box-shadow:var(--shadow-card);display:grid;gap:8px}
.l1{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:400 13px/1.3 var(--font-sans)}
.l1 b{font-weight:500}.quiet{color:var(--fg-3)}
.l2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font:400 12.5px/1.3 var(--font-sans);color:var(--fg-2)}
.tgl{width:28px;height:16px;border-radius:999px;background:var(--fg);position:relative;display:inline-block;vertical-align:middle}
.tgl::after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:999px;background:var(--bg)}
.u{font-weight:500;color:var(--fg);text-decoration:underline;text-underline-offset:2px}
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--surface-2)}
.seg span{padding:4px 10px;border-radius:999px;font:500 12px/1 var(--font-sans);color:var(--fg-2)}
.seg span.on{background:var(--bg);color:var(--fg);box-shadow:var(--shadow-card)}
.text{padding:10px 16px 4px;font:400 14.5px/1.8 var(--font-sans)}
.text .at{color:var(--fg-2)}
.bar{display:flex;justify-content:flex-end;padding:6px 8px 8px}
.send{height:32px;padding:0 14px;border-radius:999px;background:var(--fg);color:var(--on-ink);font:500 13px/32px var(--font-sans)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font:500 11px/1 var(--font-sans);box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--fg-3)}
.menu{border-radius:var(--r-2xl);background:var(--elev);box-shadow:var(--shadow-menu);padding:6px}
.opt{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border-radius:16px}
.opt.on{background:var(--wash)}
.opt b{font:500 13px/1.3 var(--font-sans)}.opt i{font:normal 400 11.5px/1.3 var(--font-sans);color:var(--fg-3);flex:1}
.ico{width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--fg-3)}
.asked{display:grid;justify-items:end;gap:4px}
.asked small{font:400 11.5px/1.3 var(--font-sans);color:var(--fg-3)}
.bubble{max-width:80%;padding:10px 16px;border-radius:22px 8px 22px 22px;background:var(--bubble);font:400 14.5px/1.55 var(--font-sans)}
.card{padding:14px 14px 12px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:8px}
.card header{display:flex;align-items:center;gap:10px;font:500 13.5px/1.3 var(--font-sans)}
.mark{width:16px;height:16px;border-radius:999px;background:var(--fg)}
.rowcard{display:flex;gap:12px;align-items:flex-start;margin-left:24px;padding:12px 14px;border-radius:16px;background:var(--bg);box-shadow:var(--shadow-card)}
.av{width:32px;height:32px;border-radius:999px;background:var(--surface)}
.rowcard div{flex:1;min-width:0}.rowcard b{display:block;font:500 14px/1.3 var(--font-sans)}.rowcard span{font:400 12px/1.3 var(--font-sans);color:var(--fg-3)}
.pill{height:22px;padding:0 9px;border-radius:999px;background:var(--done);color:var(--on-done);font:500 11.5px/22px var(--font-sans)}
.answer{margin-left:24px;padding:12px 14px;border-radius:16px;background:var(--bg);box-shadow:var(--shadow-card);font:400 14px/1.5 var(--font-sans)}
</style>
</head><body>
<template id="ask">
  <p class="cap">Ask chip</p>
  <div class="composer">
    <div class="chipcard">
      <div class="l1"><span class="ico"></span><b>Ask Hermes on box (remote)</b><span class="chip">Remote</span><span class="quiet">instead of this thread's agent</span></div>
      <div class="l2"><span><span class="tgl"></span>&nbsp; Thread excerpt: last 12 of 40 messages, 3.1k characters &nbsp;<span class="u">Preview</span></span><span class="seg"><span class="on">Wake this thread</span><span>Just show it</span></span></div>
    </div>
    <div class="text"><span class="at">@hermes-box</span> what do the server logs say about last night's failed deploy?</div>
    <div class="bar"><span class="send">Ask</span></div>
  </div>
  <p class="cap">@ menu at the start of a message</p>
  <div class="menu">
    <div class="opt on"><span class="ico"></span><b>Hermes on box</b><i>Ask a remote agent</i><span class="chip">Remote</span></div>
    <div class="opt"><span class="ico"></span><b>Researcher</b><i>Ask a crew role</i></div>
    <div class="opt"><span class="ico"></span><b>report.html</b><i>artifacts</i></div>
  </div>
  <p class="cap">Sent, Just show it</p>
  <div class="asked"><small>Asked Hermes on box (remote) · with 12 messages of this thread · the answer only shows here</small><div class="bubble">What do the server logs say about last night's failed deploy?</div></div>
  <div class="card">
    <header><span class="mark"></span>Asked Hermes on box <span class="chip">Remote · Hermes on box</span></header>
    <div class="rowcard"><span class="av"></span><div><b>Ask: What do the server logs say…</b><span>hermes-box · #ops · report in · 2m ago</span></div><span class="pill">Done</span></div>
    <div class="answer">The deploy failed at 02:14 on a migration lock; the retry at 02:20 went through.</div>
  </div>
</template>
<div class="pair">
  <div class="pane" data-theme="light"><h3>Light</h3><div class="slot" style="display:grid;gap:12px"></div></div>
  <div class="pane" data-theme="dark"><h3>Dark</h3><div class="slot" style="display:grid;gap:12px"></div></div>
</div>
<script>
for (const slot of document.querySelectorAll('.slot')) slot.appendChild(document.getElementById('ask').content.cloneNode(true));
</script>
</body></html>
