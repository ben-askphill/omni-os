<!-- @dsCard group="01 Logo" viewport="700x300" name="Mark — motion states" subtitle="Live: idle, hover, thinking, delegating, report, attention" width=700 height=300 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{padding:24px 28px}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:1px solid var(--line)}.c{display:grid;justify-items:center;gap:14px;padding:26px 0 0;border-right:1px solid var(--line)}.c:last-child{border-right:0}.l{font:var(--type-meta);color:var(--text-3);text-align:center;display:grid;gap:6px;padding:0 6px}.l b{font:500 12px/1 var(--font-sans);color:var(--text-1)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady(({ OmniMark }) => {
  const S = [['idle','almost still'],['hover','leans to pointer'],['thinking','surface ripples'],['delegating','droplets pinch off'],['report','droplet merges in'],['attention','held until ack']];
  function App(){
    const [ack,setAck]=React.useState(false);
    return <div className="g">{S.map(([s,d])=>(
      <div className="c" key={s}>
        <OmniMark size={96} state={s==='attention'&&ack?'idle':s} onAcknowledge={()=>{setAck(true);setTimeout(()=>setAck(false),2400)}} />
        <div className="l"><b>{s}</b><span>{d}</span></div>
      </div>))}</div>;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
