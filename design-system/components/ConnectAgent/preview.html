<!-- @dsCard group="13 Panels" name="ConnectAgent — Connect an agent sheet" subtitle="Steps, found agent with capability chips and the remote mark, sign in, test outcome; light and dark" width=1120 height=820 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--canvas);color:var(--fg);font:var(--type-body)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pane{min-width:0;padding:14px 16px;border-radius:var(--r-2xl);background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.pane h3{margin:2px 0 10px;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}
.sheet{border-radius:28px;background:var(--elev);box-shadow:var(--shadow-menu);overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 24px;font:500 17px/1.3 var(--font-display,var(--font-sans))}
.x{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--fg-3)}
.in{padding:0 24px 18px;display:grid;gap:14px}
.blurb{margin:0;font:400 13px/20px var(--font-sans);color:var(--fg-2)}
.steps{display:flex;gap:16px;font:400 13px/1.3 var(--font-sans)}
.step{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.dot.done{background:var(--done);box-shadow:none}
.dot.now{box-shadow:inset 0 0 0 1.5px var(--fg-2)}
label{display:block;margin:0 0 4px;font:500 12.5px/1.3 var(--font-sans);color:var(--fg-2)}
.row{display:flex;gap:8px}
.field{flex:1;min-width:0;height:34px;padding:0 12px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:400 13px/34px var(--font-mono);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--surface-2);font:500 13px/1 var(--font-sans);color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--on-ink)}
.box{padding:12px;border-radius:14px;background:var(--bg);display:grid;gap:8px}
.name{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.name b{font:500 14px/1.3 var(--font-sans)}.name span{font:400 12.5px/1.3 var(--font-sans);color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font:500 11px/1 var(--font-sans);background:var(--surface-2);color:var(--fg-2)}
.chip.outline{background:none;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--fg-3)}
.cap{margin:0;font:500 11px/1.3 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3)}
.note{margin:0;font:400 13px/1.4 var(--font-sans);color:var(--fg-2)}
.reply{margin:0;font:400 13.5px/1.4 var(--font-sans)}.meta{margin:0;font:400 12px/1.4 var(--font-sans);color:var(--fg-3)}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line)}
</style>
</head><body>
<template id="sheet">
  <div class="sheet">
    <div class="head">Connect an agent<span class="x">✕</span></div>
    <div class="in">
      <p class="blurb">An agent on your own server, such as Hermes, becomes a harness threads run on. Nothing is saved until its test turn passes and you press Connect.</p>
      <div class="steps"><span class="step"><span class="dot done"></span>Find</span><span class="step"><span class="dot done"></span>Sign in</span><span class="step"><span class="dot done"></span>Test</span></div>
      <div><label>Agent address, link or code</label><div class="row"><span class="field">omni://connect-agent?url=http%3A%2F%2Fhermes.tail1234.ts.net%3A8642&amp;code=GB8Z-…</span><span class="btn">Find</span></div></div>
      <div class="box">
        <div class="name"><b>Hermes on hetzner</b><span>hermes.tail1234.ts.net:8642</span></div>
        <div class="chips"><span class="chip outline">Runs API</span><span class="chip outline">Tailnet</span></div>
        <div class="chips"><span class="chip">Steer</span><span class="chip">Stop</span><span class="chip">Tool rows</span><span class="chip">Token counts</span><span class="chip outline">No worktree</span><span class="chip outline">No browser</span><span class="chip outline">No omni tools</span></div>
      </div>
      <p class="cap">Sign in</p>
      <p class="note">Paired with hermes.tail1234.ts.net:8642. The key is in this machine's server and is never shown.</p>
      <p class="cap">Test</p>
      <div class="box"><p class="reply">“I am Hermes, running claude-opus-5-5.”</p><p class="meta">claude-opus-5-5 · first event 0.4 s · done in 1.2 s · 18 tokens</p></div>
      <div class="chips"><span class="chip outline">Remote · hermes.tail1234.ts.net:8642</span></div>
    </div>
    <div class="foot"><span class="btn">Cancel</span><span class="btn primary">Connect</span></div>
  </div>
</template>
<div class="pair">
  <div class="pane" data-theme="light"><h3>Light</h3><div class="slot"></div></div>
  <div class="pane" data-theme="dark"><h3>Dark</h3><div class="slot"></div></div>
</div>
<script>
for (const slot of document.querySelectorAll('.slot')) slot.appendChild(document.getElementById('sheet').content.cloneNode(true));
</script>
</body></html>
