<!-- @dsCard group="14 Phone" name="PhoneActivity" subtitle="The Activity screen in light and dark" width=860 height=900 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{margin:0;padding:20px 24px;background:var(--canvas)}.pair{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.ph{position:relative;isolation:isolate;flex:none;width:390px;overflow:hidden;background:var(--bg);color:var(--fg);border-radius:28px;box-shadow:0 0 0 1px var(--line);padding:16px 0;display:grid;gap:12px;align-content:start}.ph>.pad{padding:0 16px}.ph .cap{padding:0 16px;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady((NS) => {
const {MoHeader, MoLargeTitle, MoSection, MoDecisionCard, MoThreadRow, MoTabBar, MoRoundButton, OmniMark} = NS;
function Screen(){const [v,setV]=React.useState('activity');return <><MoHeader flush left={<OmniMark size={28}/>} right={<MoRoundButton icon="search" label="Search"/>}/><MoLargeTitle title="Activity" sub="Friday 23 October" needs={1} running={2}/><MoSection title="Needs you" count={1}><div style={{padding:'0 16px'}}><MoDecisionCard kind="confirm" title="Pause WEEKEND15 until the patch ships?" channel="volero" role="store-ops" via time="2m" body="Still firing on free-shipping carts." confirmLabel="Pause it" denyLabel="Leave it on"/></div></MoSection><MoSection title="Running" count={2}><MoThreadRow title="Patch shipping-rate script" state="running" role="builder" channel="volero" progress="step 5/9" time="12m"/><MoThreadRow title="Draft the returns copy" state="running" role="inbox" channel="volero" progress="140 of 212" time="20m" last/></MoSection><MoSection title="Done today" count={1}><MoThreadRow title="Compare checkout funnel" state="done" role="researcher" channel="volero" meta="report in" time="4m" artifacts={1} last/></MoSection><div style={{padding:'8px 16px 0'}}><MoTabBar placement="static" value={v} onChange={setV} needs={1} onNew={()=>{}}/></div></>}
function Phone({theme}){return <div className="ph" data-theme={theme}><Screen/></div>}
function App(){return <div className="pair"><Phone theme="light"/><Phone theme="dark"/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
