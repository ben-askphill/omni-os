<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--canvas);color:var(--fg);font:var(--type-body)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pane{min-width:0;padding:14px 16px;border-radius:var(--r-2xl);background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.pane h3{margin:2px 0 10px;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}
h4{margin:18px 0 8px;font:500 13px/1.2 var(--font-sans)}
.cells{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
.cell{display:grid;gap:4px;justify-items:center;text-align:center;min-width:44px}.cell .om-caption{font-size:10.5px;line-height:1.25}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:8px}.lab{width:64px;flex:none;font:400 11.5px/1.2 var(--font-sans);color:var(--fg-3)}
svg{display:block;flex:none}
.use{display:grid;gap:6px;margin-bottom:12px}
.author{display:flex;align-items:center;gap:12px;font:400 13px/1 var(--font-sans)}.author .t{font-size:11px;color:var(--fg-3)}
.ph{display:block;border-radius:999px;background:linear-gradient(135deg,#ff4983,#52cdfe)}
.ic{display:grid;place-items:center;border-radius:999px}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px 0 4px;border-radius:999px;background:var(--surface-2);font:400 11px/1 var(--font-sans);color:var(--fg-2)}
.msg{font:400 14px/1.5 var(--font-sans)}
.pill{display:inline-flex;align-items:center;gap:.25em;padding:0 .4em 0 .15em;border-radius:999px;background:color-mix(in srgb,var(--agent) 55%,transparent);vertical-align:baseline}
.srow{display:flex;align-items:center;gap:12px;font:400 13px/1.3 var(--font-sans)}.srow small{color:var(--fg-3)}
</style>
</head><body>
