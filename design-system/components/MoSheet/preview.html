<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{margin:0;padding:20px 24px;background:var(--canvas)}.pair{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.ph{position:relative;isolation:isolate;flex:none;width:390px;overflow:hidden;background:var(--bg);color:var(--fg);border-radius:28px;box-shadow:0 0 0 1px var(--line);padding:16px 0;display:grid;gap:12px;align-content:start}.ph>.pad{padding:0 16px}.ph .cap{padding:0 16px;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady((NS) => {
const {MoSheet, MoGroup, MoListRow} = NS;
function Screen(){return <div style={{position:'relative',height:500,transform:'translateZ(0)'}}><MoSheet title="Thread" onClose={()=>{}}><div style={{padding:'0 16px 16px'}}><MoGroup><MoListRow icon="pin" label="Pin thread" onPress={()=>{}} chevron={false}/><MoListRow icon="share" label="Share report" onPress={()=>{}} chevron={false}/><MoListRow icon="archive" label="Archive" onPress={()=>{}} chevron={false} last/></MoGroup></div></MoSheet></div>}
function Phone({theme}){return <div className="ph" data-theme={theme}><Screen/></div>}
function App(){return <div className="pair"><Phone theme="light"/><Phone theme="dark"/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
