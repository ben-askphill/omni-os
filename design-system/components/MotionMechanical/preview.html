<!-- @dsCard group="05 Motion" viewport="700x250" name="Motion — Bencho springs" subtitle="Touch is springy: wash scales in, press shrinks, thumbs stretch then settle. From web/src/index.css." width=700 height=250 -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:var(--bg)}code{font:var(--type-meta);color:var(--fg-3)}.r{display:grid;grid-template-columns:170px 1fr 190px;align-items:center;gap:14px;height:44px;border-bottom:1px solid var(--line)}.t{position:relative;height:18px}.t i{position:absolute;left:0;top:0;width:44px;height:18px;border-radius:999px;background:var(--fg);animation:mv 2s infinite}@keyframes mv{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(calc(var(--w) - 44px))}95%,100%{transform:translateX(0)}}</style></head><body>
<div class="r"><code>--ease-spring</code><div class="t" style="--w:100%"><i style="animation-timing-function:cubic-bezier(.24,1.34,.38,1)"></i></div><code>hover wash 320ms, toggle</code></div><div class="r"><code>--ease-settle</code><div class="t" style="--w:100%"><i style="animation-timing-function:cubic-bezier(.28,1.28,.36,1)"></i></div><code>press 220ms, thumb 420ms, pop</code></div><div class="r"><code>--ease-stretch</code><div class="t" style="--w:100%"><i style="animation-timing-function:cubic-bezier(.32,.72,.24,1)"></i></div><code>thumb stretch 190ms</code></div><div class="r"><code>--ease-out</code><div class="t" style="--w:100%"><i style="animation-timing-function:cubic-bezier(.22,1,.36,1)"></i></div><code>enter, rise, sheets</code></div><div style="display:flex;gap:12px;align-items:center;margin-top:14px"><button class="om-btn om-btn--ghost">Hover me</button><button class="om-btn om-btn--primary">Press me</button><button class="om-tgl" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"><span class="om-tgl-knob"></span></button><code>live — hover, press, toggle</code></div></body></html>
