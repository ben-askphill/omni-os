<!-- @dsCard group="13 Panels" name="AgentIdentity — an agent's Identity block" subtitle="Live preview with its thread sample, name and description, one avatar source, background; an SVG on navy, light and dark" width=1120 height=720 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--canvas);color:var(--fg);font:var(--type-body)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pane{min-width:0;padding:14px 16px;border-radius:var(--r-2xl);background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.pane h3{margin:2px 0 10px;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}
.card{display:grid;gap:18px;padding:18px;border-radius:20px;background:var(--surface)}
.title{margin:0;font:500 15px/1.3 var(--font-display,var(--font-sans))}.sub{margin:2px 0 0;font:400 12.5px/1.4 var(--font-sans);color:var(--fg-3)}
.top{display:flex;gap:18px;align-items:flex-start}
.prev{display:flex;flex-direction:column;align-items:center;gap:9px;width:112px;flex:none}
.av{display:grid;place-items:center;border-radius:999px;background:#283c62}
.av svg{width:58%;height:58%}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--bg);font:500 12px/1 var(--font-sans)}
.cap{margin:0;text-align:center;font:400 11.5px/15px var(--font-sans);color:var(--fg-3)}
.fields{display:grid;gap:12px;flex:1;min-width:0}
label{display:block;margin-bottom:5px;font:500 13px/1.2 var(--font-sans)}
.hint{display:block;margin:-2px 0 6px;font:400 12.5px/1.35 var(--font-sans);color:var(--fg-3)}
.field{display:block;padding:9px 12px;border-radius:14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font:400 14px/1.35 var(--font-sans)}
.btn{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font:500 13px/1 var(--font-sans)}
.btn.ghost{background:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{margin:0;font:400 12px/17px var(--font-sans);color:var(--fg-3)}
.sw{width:28px;height:28px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.sw.on{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head><body>
<template id="card">
  <div class="card">
    <div><p class="title">Identity</p><p class="sub">Its name, what it does, and the face on every message Builder writes.</p></div>
    <div class="top">
      <div class="prev">
        <span class="av" style="width:88px;height:88px"><svg viewBox="0 0 24 24"><path d="M5 19 L12 4 L19 19 Z" fill="#f5e6ba"/><circle cx="12" cy="14" r="2.5" fill="#733e35"/></svg></span>
        <span class="pill"><span class="av" style="width:20px;height:20px"><svg viewBox="0 0 24 24"><path d="M5 19 L12 4 L19 19 Z" fill="#f5e6ba"/></svg></span>Builder</span>
        <p class="cap">Your SVG on its color.</p>
      </div>
      <div class="fields">
        <div><label>Name</label><span class="field">Builder</span></div>
        <div><label>Description</label><span class="hint">The Conductor reads it to pick an agent for a task.</span><span class="field">Writes code in a repo channel. Works in its own worktree and opens PRs.</span></div>
      </div>
    </div>
    <div class="row" style="gap:6px"><label style="width:100%;margin:0">Avatar</label>
      <span class="om-seg" style="--h-seg:28px"><span class="om-seg-item">Built-in</span><span class="om-seg-item">Emoji</span><span class="om-seg-item">Icon</span><span class="om-seg-item" style="background:var(--bg);color:var(--fg)">Upload</span></span>
    </div>
    <div style="display:grid;gap:6px"><div class="row"><span class="btn">Replace</span></div><p class="note">A plain SVG up to 20 KB, drawn on the background below. Transparent parts show the color.</p></div>
    <div style="display:grid;gap:8px"><label style="margin:0">Background</label>
      <div class="row"><span class="sw" style="background:#e8d9f5"></span><span class="sw" style="background:#d4e9fa"></span><span class="sw" style="background:#d3eee4"></span><span class="sw" style="background:#f5e6ba"></span><span class="sw" style="background:#f6d9cd"></span><span class="sw on" style="background:#283c62"></span><span class="sw" style="background:#354f42"></span><span class="sw" style="background:#733e35"></span></div>
    </div>
  </div>
</template>
<div class="pair">
  <div class="pane" data-theme="light"><h3>Light</h3><div class="slot"></div></div>
  <div class="pane" data-theme="dark"><h3>Dark</h3><div class="slot"></div></div>
</div>
<script>
for (const slot of document.querySelectorAll('.slot')) slot.appendChild(document.getElementById('card').content.cloneNode(true));
</script>
</body></html>
