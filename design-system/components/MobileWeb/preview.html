<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omni mobile web</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--fg);font:14px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased}
.cv-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 16px;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.cv-bar h1{font:500 15px/1.2 var(--font-head);margin:0}
.cv-meta{font:12px var(--font-sans);color:var(--fg-3);font-variant-numeric:tabular-nums}
.cv-zoom{display:flex;gap:4px;align-items:center;margin-left:auto}
.cv-zoom span{font:12px var(--font-sans);color:var(--fg-3);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.cv-nav{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.cv-pill{height:30px;padding:0 12px;border:0;border-radius:var(--r-pill,999px);background:var(--surface-2);color:var(--fg-2);font:13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;transition:transform 220ms var(--ease-settle,cubic-bezier(.2,.9,.25,1))}
.cv-pill:hover{color:var(--fg);background:var(--surface-3)}
.cv-pill:active{transform:scale(.96)}
.cv-pill:focus-visible{outline:1.5px solid var(--focus);outline-offset:2px}
.cv-canvas{padding:32px 16px 160px}
.cv-group{margin-bottom:88px;scroll-margin-top:120px}
.cv-group>header{max-width:680px;margin-bottom:24px}
.cv-group h2{font:500 22px/1.2 var(--font-head);letter-spacing:-.22px;margin:0;text-wrap:balance}
.cv-group header p{font:13px/1.5 var(--font-sans);color:var(--fg-3);margin:4px 0 0}
.cv-row{display:flex;flex-wrap:wrap;gap:56px 64px;align-items:flex-start}
.cv-screen{width:390px;max-width:100%;flex:none;scroll-margin-top:120px}
.cv-lab{display:flex;align-items:baseline;gap:8px;margin:0 4px 6px}
.cv-id{font:500 12px var(--font-mono);color:var(--fg);background:var(--bg);border-radius:var(--r-xs,6px);padding:2px 6px;box-shadow:0 0 0 1px var(--line)}
.cv-title{font:500 14px var(--font-sans)}
.cv-tall{font:11px var(--font-sans);color:var(--fg-3);margin-left:auto;white-space:nowrap}
.cv-route{margin:0 4px 10px;font:11.5px var(--font-mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-phone{width:390px;max-width:100%;border-radius:36px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 2px var(--line)}
.cv-phone img{display:block;width:100%;height:auto}
.cv-note{margin:10px 4px 0;font:12px/1.4 var(--font-sans);color:var(--fg-3)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important}}
</style>
</head><body>

    <span id="cv-z">100%</span>
    <button class="cv-pill" type="button" id="cv-in" aria-label="Zoom in">+</button>
  </div>
  <nav class="cv-nav" id="cv-nav" aria-label="Flows"></nav>
</div>

const IMG = '../../screens/mobile/';
const cv = document.getElementById('cv');
const nav = document.getElementById('cv-nav');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
document.getElementById('cv-meta').textContent = `${DATA.screens.length} screens · 390 × 844 · light · captured 3 Nov 2026 from main @ 81a26ad`;
for (const g of DATA.groups) {
  const items = DATA.screens.filter((s) => s.group === g.name);
  if (!items.length) continue;
  const slug = 'flow-' + g.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const sec = document.createElement('section');
  sec.className = 'cv-group';
  sec.id = slug;
  sec.innerHTML = `<header><h2>${esc(g.name)}</h2><p>${esc(g.blurb)} ${items.length} screens.</p></header><div class="cv-row"></div>`;
  const row = sec.querySelector('.cv-row');
  for (const s of items) {
    const el = document.createElement('article');
    el.className = 'cv-screen';
    el.id = s.id;
    el.innerHTML = `<div class="cv-lab"><span class="cv-id">${s.id}</span><span class="cv-title">${esc(s.title)}</span>${s.h > 844 ? '<span class="cv-tall">Full scroll height</span>' : ''}</div>
      <div class="cv-route">#${esc(s.route)}</div>
      <div class="cv-phone"><img src="${IMG}${s.file}" alt="${s.id} ${esc(s.title)}" width="390" height="${s.h}" loading="lazy"></div>
      ${s.note ? `<p class="cv-note">${esc(s.note)}</p>` : ''}`;
    row.appendChild(el);
  }
  cv.appendChild(sec);
  const a = document.createElement('a');
  a.className = 'cv-pill';
  a.href = `#${slug}`;
  a.textContent = g.name;
  nav.appendChild(a);
}
const ZOOMS = [0.25, 0.35, 0.5, 0.75, 1];
let zi = ZOOMS.length - 1;
try { const z = Number(localStorage.getItem('cv-zoom')); if (ZOOMS.includes(z)) zi = ZOOMS.indexOf(z); } catch {}
const applyZoom = () => {
  cv.style.zoom = ZOOMS[zi];
  document.getElementById('cv-z').textContent = `${Math.round(ZOOMS[zi] * 100)}%`;
  try { localStorage.setItem('cv-zoom', String(ZOOMS[zi])); } catch {}
};
document.getElementById('cv-out').addEventListener('click', () => { zi = Math.max(0, zi - 1); applyZoom(); });
document.getElementById('cv-in').addEventListener('click', () => { zi = Math.min(ZOOMS.length - 1, zi + 1); applyZoom(); });
applyZoom();
</script>
