<!-- @dsCard group="12 Thread" viewport="760x980" name="QuestionCard" subtitle="ask_user_question: pending with pager, answered summary, phone width" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{padding:20px 24px;background:var(--bg)}.phone{width:390px;margin-top:8px;padding:12px 16px;box-sizing:border-box;border-radius:var(--r-xl);background:var(--bg);box-shadow:var(--shadow-card)}.lab{margin:18px 0 2px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady(({ QuestionCard, Message }) => {
const o = (label, description) => ({ label, description });
const qs = [
  { question: 'Which Q4 goal should get the most of your time between now and December?', header: 'Q4 focus', multiSelect: false, options: [o('Acne POC', 'Prove the SFCC to Shopify move on one market before the scoping call.'), o('Volero hypercare', 'Stay close to the new theme and imports while orders ramp up.'), o('KE go-live', 'Land the Shopify Plus migration and the POS rollout for Kamera Express.'), o('Pink Gellac', 'Finish the APA theme pages in time for the brand refresh.')] },
  { question: 'Which clients should get a weekly status email?', header: 'Status mail', multiSelect: true, options: [o('Volero', 'Imports, translations and open theme tickets.'), o('Kamera Express', 'Migration milestones and POS readiness.'), o('Pink Gellac', 'Page builds and what is left before launch.')] },
];
function App(){return <div className="om-thread"><div className="om-transcript">
  <Message role="user" time="09:17">Plan the Q4 priorities with me.</Message>
  <QuestionCard questions={qs} />
  <div className="om-caption lab">Answered</div>
  <QuestionCard state="answered" questions={qs} answers={[{ selected: ['Volero hypercare'], other: null }, { selected: ['Volero', 'Pink Gellac'], other: 'Acne too, monthly' }]} />
</div>
<div className="om-caption lab">Phone, 390pt</div>
<div className="phone om-thread"><div className="om-transcript"><QuestionCard touch questions={qs.slice(0, 1)} /></div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
