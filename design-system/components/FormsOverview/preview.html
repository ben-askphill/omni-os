<!-- @dsCard group="07 Components" viewport="720x340" name="Bencho blocks" subtitle="Segmented thumb, liquid toggle, inline confirm + undo fuse, slide to confirm, picker, checklist, ticks" width=720 height=340 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{padding:20px 24px;background:var(--bg)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.lab{width:84px;flex:none}.stack{display:grid;gap:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady(({ Segmented, Toggle, InlineConfirm, SlideToConfirm, Picker, CheckItem, Ticks, CrewMark }) => {
function App(){const [s,setS]=React.useState('threads');const [t,setT]=React.useState(true);const [p,setP]=React.useState('builder');const [ck,setCk]=React.useState(['completed','in_progress','pending']);
const next=(i)=>setCk(c=>c.map((v,j)=>j===i?(v==='completed'?'pending':v==='pending'?'in_progress':'completed'):v));
return <div className="stack">
<div className="row"><span className="lab om-caption">segmented</span><Segmented value={s} onChange={setS} options={[{id:'threads',label:'Threads'},{id:'prs',label:'PRs',count:2},{id:'settings',label:'Settings'}]}/><Segmented size="sm" radio value={t?'light':'dark'} onChange={(v)=>setT(v==='light')} options={[{id:'light',icon:'sun',title:'Light'},{id:'system',icon:'monitor',title:'System'},{id:'dark',icon:'moon',title:'Dark'}]}/></div>
<div className="row"><span className="lab om-caption">toggle</span><Toggle checked={t} onChange={setT} label="Notify"/><Toggle checked={!t} onChange={(v)=>setT(!v)} label="Other"/><span className="om-caption" style={{marginLeft:12}}>confirm</span><InlineConfirm label="Pause WEEKEND15" icon="pause" confirmLabel="Pause until #812" doneLabel="Paused" undoMs={4000} onConfirm={()=>{}}/><InlineConfirm label="Archive" icon="archive" confirmLabel="Archive thread" needs={false} doneLabel="Archived" onConfirm={()=>new Promise(r=>setTimeout(r,700))}/></div>
<div className="row"><span className="lab om-caption">picker</span><Picker label="Crew role" value={p} onChange={setP} options={[{value:'conductor',label:'Conductor',sub:'Delegates to the crew'},{value:'researcher',label:'Researcher',sub:'Reads, measures, reports'},{value:'builder',label:'Builder',sub:'Changes code, opens PRs'},{value:'store-ops',label:'Store ops',sub:'Shopify admin'}].map(o=>({...o,lead:<span style={{display:'grid',placeItems:'center',width:24,height:24,borderRadius:'50%',background:'var(--bg)'}}><CrewMark role={o.value} size={13}/></span>}))}/><Picker label="Channel" value="Volero" onChange={()=>{}} options={['Volero','Pink Gellac','Acne Studios'].map(n=>({value:n,label:'#'+n,avatar:n}))}/></div>
<div className="row" style={{alignItems:'flex-start'}}><span className="lab om-caption">checklist</span><div style={{width:280}}><CheckItem state={ck[0]} onClick={()=>next(0)}>Find where the drop is</CheckItem><CheckItem state={ck[1]} onClick={()=>next(1)}>Decide on WEEKEND15</CheckItem><CheckItem state={ck[2]} onClick={()=>next(2)}>Merge #812</CheckItem></div><div style={{display:'grid',gap:10,width:220}}><span className="om-caption">ticks</span><Ticks value={.46}/><Ticks value={.93} tone="needs"/></div></div>
<div className="row"><span className="lab om-caption">slide</span><div style={{width:360}}><SlideToConfirm label="Slide to merge into main" doneLabel="Merged" busyLabel="Merging" onConfirm={()=>new Promise(r=>setTimeout(r,900))}/></div></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
