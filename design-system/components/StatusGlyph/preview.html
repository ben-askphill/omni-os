<!-- @dsCard group="08 Core" viewport="720x110" name="StatusGlyph" subtitle="Shape + colour: ping, diamond, edged disc, dot, ring" width=720 height=110 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{padding:20px 24px;background:var(--bg)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.lab{width:84px;flex:none}.stack{display:grid;gap:16px}.cells{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start}.cell{display:grid;gap:8px;justify-items:start;align-content:start}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady(({ StatusGlyph }) => {

function App(){return <div className="cells"><div className="cell"><span className="om-caption">running</span><StatusGlyph state="running"/></div><div className="cell"><span className="om-caption">needs</span><StatusGlyph state="needs"/></div><div className="cell"><span className="om-caption">done</span><StatusGlyph state="done"/></div><div className="cell"><span className="om-caption">settled</span><StatusGlyph state="settled"/></div><div className="cell"><span className="om-caption">queued</span><StatusGlyph state="queued"/></div><div className="cell"><span className="om-caption">idle</span><StatusGlyph state="idle"/></div><div className="cell"><span className="om-caption">failed</span><StatusGlyph state="failed"/></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
