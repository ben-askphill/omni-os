<!-- @dsCard group="08 Core" viewport="720x110" name="StatusGlyph" subtitle="Plain words to marks: blue disc, diamond, amber square, cross, volt tick, bar, dashed ring, dot" width=720 height=110 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../assets/ds-fallback.js" data-root="../.."></script>
<style>body{padding:20px 24px;background:var(--bg)}.cells{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-start}.cell{display:grid;gap:8px;justify-items:start;align-content:start}</style>
</head><body><div id="root"></div>
<script type="text/babel">
omReady(({ StatusGlyph }) => {
const S = ['running', 'needs', 'limited', 'failed', 'done', 'settled', 'queued', 'idle', 'reconnecting'];
function App(){return <div className="cells">{S.map((s) => <div key={s} className="cell"><span className="om-caption">{s}</span><StatusGlyph state={s}/></div>)}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script>
</body></html>
