<!-- @dsCard group="12 Thread" name="MergeRiskCard — a PR's merge risk in its thread" subtitle="Merge-ready, needs a read with gaps, high, not rated; light and dark" width=1120 height=760 -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:20px 24px;background:var(--canvas);color:var(--fg);font:var(--type-body)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pane{min-width:0;padding:14px 16px;border-radius:var(--r-2xl);background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line);display:grid;gap:12px;align-content:start}
.pane h3{margin:2px 0 0;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}
.cap{margin:4px 0 0;font:500 11px/1.3 var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3)}
.card{padding:12px 16px;border-radius:22px;background:var(--surface)}
.top{display:flex;align-items:flex-start;gap:12px;min-width:0}
.disc{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:999px;background:var(--bg);color:var(--fg-2)}
.disc svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.disc.ok{color:var(--fg)}
.body{min-width:0;flex:1}
.l1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.title{font:500 13.5px/1.3 var(--font-sans)}
.t-medium{color:var(--warn)}.t-high{color:var(--danger-text)}.t-unrated{color:var(--fg-2)}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:999px;font:500 12px/1 var(--font-sans);color:var(--ink)}
.pill::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--ink)}
.pill.done{background:var(--done)}.pill.needs{background:var(--needs)}
.l2{margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;font:400 12.5px/1.4 var(--font-sans);color:var(--fg-3)}
.l2 .v{color:var(--fg-2)}.l2 a{color:var(--fg);font-weight:500;text-decoration:none}
.mono{font-family:var(--font-mono);font-size:11.5px}
ul{margin:8px 0 0;padding:0 0 0 44px;list-style:none;display:grid;gap:4px;font:400 12.5px/1.5 var(--font-sans);color:var(--fg-2)}
li{display:flex;gap:8px;align-items:baseline;min-width:0}
.vd{flex:none;font:500 11px/1 var(--font-sans);letter-spacing:.04em;text-transform:uppercase}
.vd.poor{color:var(--danger-text)}.vd.decent{color:var(--warn)}
li b{font-weight:500;color:var(--fg)}
code{padding:1px 4px;border-radius:6px;background:var(--bg);color:var(--fg);font-family:var(--font-mono);font-size:11.5px}
.why{margin:8px 0 0;padding-left:44px;font:400 12.5px/1.5 var(--font-sans);color:var(--fg-2)}
</style>
</head><body>
<template id="cards">
  <p class="cap">Merge-ready</p>
  <section class="card">
    <div class="top"><span class="disc ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div class="body">
      <div class="l1"><span class="title">Merge risk low</span><span class="pill done">merge-ready</span></div>
      <div class="l2"><span class="v">Safe to merge</span>·<a href="#">PR #914 ↗</a>·<span>rated <span class="mono">56597d6</span></span></div>
    </div></div>
  </section>
  <p class="cap">Needs a read</p>
  <section class="card">
    <div class="top"><span class="disc"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/></svg></span><div class="body">
      <div class="l1"><span class="title t-medium">Merge risk medium</span><span class="pill needs">needs-ben</span></div>
      <div class="l2"><span class="v">Read the gaps before merging</span>·<a href="#">PR #915 ↗</a>·<span>rated <span class="mono">8be1c40</span></span></div>
    </div></div>
    <ul>
      <li><span class="vd decent">Decent</span><span><b>Impact</b> touches <code>apps/server/sync/</code></span></li>
      <li><span class="vd poor">Poor</span><span><b>Verification</b> no phone screenshot</span></li>
    </ul>
  </section>
  <p class="cap">High</p>
  <section class="card">
    <div class="top"><span class="disc"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/></svg></span><div class="body">
      <div class="l1"><span class="title t-high">Merge risk high</span><span class="pill needs">needs-ben</span></div>
      <div class="l2"><span class="v">Read the gaps before merging</span>·<a href="#">PR #916 ↗</a>·<span>rated <span class="mono">c03f9a2</span></span></div>
    </div></div>
    <ul>
      <li><span class="vd poor">Poor</span><span><b>Rollback cost</b> drops a column in <code>db/migrate.ts</code></span></li>
      <li><span class="vd poor">Poor</span><span><b>Impact</b> changes the relay's pairing</span></li>
    </ul>
  </section>
  <p class="cap">Not rated</p>
  <section class="card">
    <div class="top"><span class="disc"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/></svg></span><div class="body">
      <div class="l1"><span class="title t-unrated">Merge risk not rated</span><span class="pill needs">needs-ben</span></div>
      <div class="l2"><span class="v">Read it yourself before merging</span>·<a href="#">PR #917 ↗</a>·<span>rated <span class="mono">4d2e7b1</span></span></div>
    </div></div>
    <p class="why">the rating call failed or ran out of time.</p>
  </section>
</template>
<div class="pair">
  <div class="pane" data-theme="light"><h3>Light</h3><div class="slot" style="display:grid;gap:10px"></div></div>
  <div class="pane" data-theme="dark"><h3>Dark</h3><div class="slot" style="display:grid;gap:10px"></div></div>
</div>
<script>
for (const slot of document.querySelectorAll('.slot')) slot.appendChild(document.getElementById('cards').content.cloneNode(true));
</script>
</body></html>
