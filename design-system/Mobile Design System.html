<!-- @dsCard group="00 Brand book" viewport="1440x4200" name="Mobile Design System" subtitle="Omni on a phone: principles, metrics, every mobile part, live screens. Light/dark." -->
<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omni mobile — Design System</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="assets/ds-fallback.js" data-root="."></script>
<script src="ui_kits/omni-os/data.js"></script>
<script src="ui_kits/omni-mobile/mobile-data.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}a:hover{text-decoration-color:currentColor}
.mo-scroll{scrollbar-width:none}.mo-scroll::-webkit-scrollbar{display:none}
.mo-press{transition:transform 220ms var(--ease-settle)}.mo-press:active{transform:scale(.96)}
.mo-row{border-radius:14px}.mo-row:active{background:var(--wash)}
@keyframes mo-push{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes mo-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes mo-fade{from{opacity:0}to{opacity:1}}
@keyframes mo-toast{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
.mds-doc{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.mds-toc{position:sticky;top:0;height:100vh;overflow:auto;background:var(--chrome);color:var(--fg);padding:14px 12px 24px;display:flex;flex-direction:column;gap:1px;scrollbar-width:none}
.mds-toc>*{flex:none}
.mds-toc .cap{padding:16px 12px 8px;font:500 12px/1.2 var(--font-sans);color:var(--fg-3)}
.mds-toc a{display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;border-radius:999px;font:13px var(--font-sans);color:var(--fg-2);text-decoration:none}
.mds-toc a:hover{background:var(--wash);color:var(--fg)}
.mds-main{padding:40px 48px 140px;min-width:0;max-width:1320px}
.mds-hero{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.mds-hero h1{font:500 30px/1.15 var(--font-head);letter-spacing:-.3px;margin:16px 0 0}
.mds-hero p,.mds-sec>p{font:13.5px/1.5 var(--font-sans);color:var(--fg-3);margin:6px 0 0;max-width:680px;text-wrap:pretty}
.mds-sec{padding-top:64px}
.mds-sec>h2{font:500 22px/1.2 var(--font-head);letter-spacing:-.22px;margin:0}
.mds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--min,390px)),1fr));gap:16px;margin-top:20px;align-items:start}
.mds-spec{border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mds-spec.w{grid-column:1/-1}
.mds-lab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mds-lab b{font:500 12.5px var(--font-mono);color:var(--fg)}
.mds-lab em{font:normal 12px/1.4 var(--font-sans);color:var(--fg-3);text-wrap:pretty}
.mds-lab span{margin-left:auto;font:11px var(--font-mono);color:var(--fg-4)}
.mds-stage{background:var(--surface);border-radius:14px;padding:16px}
.mds-strip{position:relative;isolation:isolate;width:min(100%,390px);margin:0 auto;background:var(--bg);border-radius:24px;box-shadow:var(--shadow-card);overflow:hidden}
.mds-idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:4px 24px;margin-top:20px}
.mds-idx div{padding:10px 0;border-top:1px solid var(--line);font:13px/1.5 var(--font-sans);color:var(--fg-3);text-wrap:pretty}
.mds-idx b{display:block;font:500 14px/1.4 var(--font-sans);color:var(--fg);margin-bottom:2px}
.mds-tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:0 24px}
.mds-tbl>div{display:grid;grid-template-columns:130px 80px minmax(0,1fr);gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font:13px var(--font-sans)}
.mds-tbl code{font:500 12.5px var(--font-mono)}.mds-tbl em{font-style:normal;font-size:12px;color:var(--fg-3)}
.mds-phones{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:40px 16px;margin-top:24px;justify-items:center}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="ui_kits/omni-os/ios-frame.jsx"></script>
<script type="text/babel" src="ui_kits/omni-mobile/MobileParts.jsx"></script>
<script type="text/babel" src="ui_kits/omni-mobile/MobileScreens.jsx"></script>
<script type="text/babel" src="ui_kits/omni-mobile/MobileThread.jsx"></script>
<script type="text/babel" src="ui_kits/omni-mobile/MobileApp.jsx"></script>
<script type="text/babel" src="ui_kits/omni-mobile/MobileDocs.jsx"></script>
<script type="text/babel">omReady(() => ReactDOM.createRoot(document.getElementById('root')).render(<MobileDocs />));</script>
</body></html>
