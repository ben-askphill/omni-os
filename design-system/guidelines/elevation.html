<!-- @dsCard group="04 Shape & space" viewport="700x200" name="Shadows" subtitle="Bencho: card hairline, thumb, menu. Scrim is ink, no blur." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--bg)}code{font:var(--type-meta);color:var(--fg-3)}body{background:var(--canvas)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}.b{height:84px;background:var(--bg);border-radius:22px}b{display:block;margin-top:4px;font:400 12px/1.35 var(--font-sans);color:var(--fg-2)}</style></head><body>
<div class="g"><div><div class="b" style="background:var(--surface)"></div><code style="display:block;margin-top:10px">flat · surface</code><b>Cards inside the pane: fill, no shadow.</b></div><div><div class="b" style="box-shadow:var(--shadow-card)"></div><code style="display:block;margin-top:10px">shadow-card</code><b>Main pane, search pill, usage card.</b></div><div><div class="b" style="box-shadow:var(--shadow-thumb);border-radius:999px;height:36px;margin-top:24px"></div><code style="display:block;margin-top:34px">shadow-thumb</code><b>Sliding thumbs.</b></div><div><div class="b" style="box-shadow:var(--shadow-menu);background:var(--elev)"></div><code style="display:block;margin-top:10px">shadow-menu</code><b>Palette, picker, toast, stack menu.</b></div></div></body></html>
