<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;background:var(--bg)}code{font:var(--type-meta);color:var(--fg-3)}.g{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}.s{display:grid;gap:4px;font:var(--type-meta);color:var(--fg-3)}.s .c{height:60px;margin-bottom:6px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}.s b{font:500 12px/1.2 var(--font-sans);color:var(--fg)}.s i{font:400 11px/1.3 var(--font-sans);font-style:normal;color:var(--fg-2)}</style></head><body>
<div class="g"><div class="s"><div class="c" style="background:var(--canvas)"></div><b>canvas</b><span>#FFFFFF</span><i>app base</i></div><div class="s"><div class="c" style="background:var(--bg)"></div><b>bg</b><span>#FFFFFF</span><i>main pane</i></div><div class="s"><div class="c" style="background:var(--surface)"></div><b>surface</b><span>#F7F7F6</span><i>cards, rows on hover</i></div><div class="s"><div class="c" style="background:var(--surface-2)"></div><b>surface-2</b><span>#F1F1F0</span><i>bubbles, pills</i></div><div class="s"><div class="c" style="background:var(--surface-3)"></div><b>surface-3</b><span>#ECEBE7</span><i>pill hover</i></div><div class="s"><div class="c" style="background:var(--fg-4)"></div><b>fg-4</b><span>#9D9C96</span><i>placeholders, caps</i></div><div class="s"><div class="c" style="background:var(--fg-3)"></div><b>fg-3</b><span>#6F6E68</span><i>meta · 5.1:1</i></div><div class="s"><div class="c" style="background:var(--fg-2)"></div><b>fg-2</b><span>#3C3B37</span><i>secondary</i></div><div class="s"><div class="c" style="background:var(--fg)"></div><b>fg</b><span>#17181A</span><i>text, ink</i></div></div></body></html>
