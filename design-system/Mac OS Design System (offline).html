  <title>Omni for Mac — Design System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0c0d0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #0c0d0f; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0c0d0f"></rect><g transform="translate(46 54) scale(.3) skewX(-10)"><circle r="40" fill="none" stroke="#eceae5" stroke-width="20"></circle><circle cx="49.5" cy="-49.5" r="12" fill="#c6f52b"></circle></g></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\" data-theme=\"light\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Omni for Mac — Design System<\u002Ftitle>\n<style>/* Omni OS fonts: Apple system faces (developer.apple.com/fonts), same stacks as web/src/index.css.\n   Apple's license rules out serving them as web fonts, so these @font-face rules only point at the local install\n   (local()). Without it, the stacks fall back to system-ui / ui-* (SF on Apple devices). SF Pro handles optical size\n   and tracking itself, so body text sets no letter-spacing. */\n@font-face{font-family:\"SF Pro\";font-style:normal;font-weight:100 900;src:local(\"SF Pro\"),local(\"SF Pro Text\"),local(\"SF Pro Display\"),local(\"SFProText-Regular\"),local(\".SFNS-Regular\")}\n@font-face{font-family:\"SF Pro Rounded\";font-style:normal;font-weight:100 900;src:local(\"SF Pro Rounded\"),local(\"SFProRounded-Regular\")}\n@font-face{font-family:\"SF Mono\";font-style:normal;font-weight:100 900;src:local(\"SF Mono\"),local(\"SFMono-Regular\")}\n:root{\n--font-sans:\"SF Pro\",\"SF Pro Text\",system-ui,-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n--font-head:\"SF Pro\",\"SF Pro Display\",system-ui,-apple-system,BlinkMacSystemFont,\"Helvetica Neue\",sans-serif;\n--font-rounded:\"SF Pro Rounded\",ui-rounded,system-ui,-apple-system,sans-serif;\n--font-mono:\"SF Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n--font-num:var(--font-sans); /* numbers, times, counts: SF Pro with tabular figures. Mono is only for code. */\n}\n\n/* Omni OS color. Neutrals from apps/web/src/index.css (Bencho warm neutrals); the three status pops are ours. */\n:root{\ncolor-scheme:light;\n/* raw pops: full saturation, never tinted */\n--ink:#17181a;\n--ultramarine:#2B3BFF;\n--ultramarine-lift:#7280FF;\n--vermilion:#FF4420;\n--volt:#C6F52B;\n/* neutrals: light. Base is pure white (canvas + main); greys only for surfaces inside it. */\n--canvas:#ffffff;\n/* chrome around the pane (sidebar, gutters): dark in both schemes */\n--chrome:#0c0d0f;\n--bg-sidebar:var(--chrome);\n--bg:#ffffff;\n--surface:#f7f7f6;\n--surface-2:#f1f1f0;\n--surface-3:#ecebe7;\n--elev:#ffffff;\n--fg:#17181a;\n--fg-2:#3c3b37;\n--fg-3:#6f6e68;\n--fg-4:#9d9c96;\n--on-ink:#ffffff;\n--line:rgb(23 24 26 / 0.08);\n--line-strong:rgb(23 24 26 / 0.16);\n--thumb:#ffffff;\n--wash:rgb(23 24 26 / 0.06);\n--pane:rgb(255 255 255 / 0.72);\n--pane-edge:rgb(23 24 26 / 0.07);\n--code-bg:var(--surface);\n--mark-hl:rgb(245 158 11 / 0.28);\n--mark:var(--mark-hl);\n/* amber for a meter filling up (context from 70%) */\n--warn:#b45309;\n/* diffs: the one place a line gets a wash */\n--diff-add:color-mix(in srgb,var(--done) 22%,transparent);\n--diff-del:color-mix(in srgb,var(--needs) 12%,transparent);\n--bubble:var(--surface-2);\n/* semantic aliases (kept from v1 so older markup still resolves) */\n--bg-raised:var(--surface);\n--bg-sunken:var(--surface-2);\n--text-1:var(--fg);\n--text-2:var(--fg-2);\n--text-3:var(--fg-3);\n--text-4:var(--fg-4);\n--text-disabled:var(--fg-4);\n--inverse-bg:var(--fg);\n--inverse-bg-hover:#2e2f32;\n--inverse-text:var(--on-ink);\n--inverse-muted:#9d9c96;\n--focus:var(--fg);\n/* status: the only color in the UI */\n--live:var(--ultramarine);\n--live-text:var(--ultramarine);\n--on-live:#ffffff;\n--needs:var(--vermilion);\n--on-needs:var(--ink);\n--done:var(--volt);\n--on-done:var(--ink);\n--done-edge:var(--ink);\n--scrim:rgb(23 24 26 / 0.22);\n}\n/* .scheme-dark: the sidebar always draws with the dark tokens */\n[data-theme=\"dark\"],.scheme-dark{\ncolor-scheme:dark;\n--canvas:#0c0d0f;\n--bg:#121316;\n--surface:#191b1e;\n--surface-2:#222428;\n--surface-3:#2a2c31;\n--elev:#212429;\n--fg:#eceae5;\n--fg-2:#b8b7b1;\n--fg-3:#908f89;\n--fg-4:#6f6e69;\n--on-ink:#101114;\n--line:rgb(236 235 231 / 0.08);\n--line-strong:rgb(236 235 231 / 0.16);\n--thumb:rgb(255 255 255 / 0.14);\n--wash:rgb(236 234 229 / 0.06);\n--pane:rgb(33 36 41 / 0.72);\n--pane-edge:rgb(255 255 255 / 0.09);\n--mark-hl:rgb(245 181 68 / 0.28);\n--warn:#f5b544;\n--inverse-bg-hover:#d6d4cf;\n--inverse-muted:#6f6e69;\n--live:var(--ultramarine-lift);\n--live-text:var(--ultramarine-lift);\n--on-live:#101114;\n--done-edge:transparent;\n--scrim:rgb(0 0 0 / 0.5);\n}\n\n/* Omni OS type. Sizes, weights and line heights lifted from web/src (index.css, ui.tsx, Sidebar, ThreadList, Transcript). */\n:root{\n--fs-label:10.5px; /* @kind font */\n--fs-meta:11px; /* @kind font */\n--fs-code:11.5px; /* @kind font */\n--fs-12:12px; /* @kind font */\n--fs-small:12.5px; /* @kind font */\n--fs-ui:13px; /* @kind font */\n--fs-nav:13.5px; /* @kind font */\n--fs-body:14px; /* @kind font */\n--fs-prose:14.5px; /* @kind font */\n--fs-subhead:15px; /* @kind font */\n--fs-input:16px; /* @kind font */\n--fs-heading:17px; /* @kind font */\n--fs-title:26px; /* @kind font */\n--fs-title-lg:30px; /* @kind font */\n--fs-display:44px; /* @kind font */\n--lh-tight:1.1; /* @kind font */\n--lh-heading:1.25; /* @kind font */\n--lh-ui:1.4; /* @kind font */\n--lh-body:1.45; /* @kind font */\n--lh-prose:1.62; /* @kind font */\n--tr-display:-0.01em; /* @kind font */\n--w-regular:400; /* @kind font */\n--w-medium:500; /* @kind font */\n--w-semibold:600; /* @kind font */\n--type-display:500 var(--fs-title-lg)/var(--lh-tight) var(--font-head);\n--type-title:500 var(--fs-title)/var(--lh-tight) var(--font-head);\n--type-heading:500 var(--fs-heading)/var(--lh-heading) var(--font-head);\n--type-subhead:500 var(--fs-subhead)/1.3 var(--font-head);\n--type-prose:400 var(--fs-prose)/var(--lh-prose) var(--font-sans);\n--type-body:400 var(--fs-body)/var(--lh-body) var(--font-sans);\n--type-list:500 var(--fs-body)/1.3 var(--font-sans);\n--type-ui:500 var(--fs-ui)/1.3 var(--font-sans);\n--type-small:400 var(--fs-small)/var(--lh-ui) var(--font-sans);\n--type-label:500 var(--fs-small)/1.3 var(--font-sans);\n--type-meta:400 var(--fs-meta)/1.2 var(--font-sans);\n--type-caption:500 var(--fs-12)/1.2 var(--font-sans);\n--type-code:400 var(--fs-code)/1.6 var(--font-mono);\n}\n\n/* Omni OS space, radii, heights, shadows. Values from apps/web/src (Tailwind classes in ui.tsx, Sidebar, Transcript, index.css). */\n:root{\n--sp-1:2px;\n--sp-2:4px;\n--sp-3:6px;\n--sp-4:8px;\n--sp-5:10px;\n--sp-6:12px;\n--sp-7:14px;\n--sp-8:16px;\n--sp-9:20px;\n--sp-10:24px;\n--sp-11:32px;\n--sp-12:40px;\n/* radii: rounded, pill-first */\n--r-xs:6px;\n--r-sm:12px;\n--r-md:14px;\n--r-lg:18px;\n--r-xl:20px;\n--r-2xl:22px;\n--r-composer:var(--r-sm);\n--r-3xl:28px;\n--r-pill:999px;\n/* control heights */\n--h-chip:20px;\n--h-pill:24px;\n--h-seg-sm:26px;\n--h-btn-sm:28px;\n--h-sub:28px;\n--h-seg:30px;\n--h-nav:32px;\n--h-icon:32px;\n--h-tool:32px;\n--h-btn:34px;\n--h-search:40px;\n--h-palette-row:48px;\n--h-btn-lg:44px;\n--h-slide:56px;\n/* shadows (Bencho) */\n--shadow-card:0 0 0 0.5px var(--pane-edge),0 1px 2px rgb(23 24 26 / 0.05);\n--shadow-thumb:0 1px 2px rgb(23 24 26 / 0.09),0 0 0 0.5px rgb(23 24 26 / 0.05);\n--shadow-menu:0 0 0 0.5px rgb(23 24 26 / 0.08),0 2px 4px rgb(23 24 26 / 0.04),0 18px 44px -10px rgb(23 24 26 / 0.2);\n--ring-focus:0 0 0 4px var(--wash);\n/* layout */\n--sidebar-w:252px;\n--measure:768px;\n--page-pad:32px;\n--panel-w:360px;\n}\n[data-theme=\"dark\"],.scheme-dark{\n--shadow-card:0 0 0 0.5px var(--pane-edge),0 1px 2px rgb(0 0 0 / 0.4);\n--shadow-thumb:0 1px 2px rgb(0 0 0 / 0.3),0 0 0 0.5px rgb(255 255 255 / 0.06);\n--shadow-menu:0 0 0 0.5px rgb(255 255 255 / 0.08),0 2px 4px rgb(0 0 0 / 0.3),0 18px 44px -10px rgb(0 0 0 / 0.65);\n}\n\n/* Omni OS motion. Touch = Bencho springs (from web/src/index.css). Agents = the liquid mark + alive states. */\n:root{\n--ease-spring:cubic-bezier(0.24,1.34,0.38,1); /* @kind other */\n--ease-settle:cubic-bezier(0.28,1.28,0.36,1); /* @kind other */\n--ease-stretch:cubic-bezier(0.32,0.72,0.24,1); /* @kind other */\n--ease-out:cubic-bezier(0.22,1,0.36,1); /* @kind other */\n--ease-linear:linear; /* @kind other */\n--ease-fluid:cubic-bezier( \n@keyframes om-panel{from{transform:translateX(18px) scale(.985);opacity:0}}\n@keyframes om-scrim{from{opacity:0}}\n@keyframes om-pik{from{opacity:0;transform:translateY(-4px) scale(.96)}to{opacity:1;transform:none}}\n@keyframes om-toast{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}\n@keyframes om-burn{from{width:100%}to{width:0}}\n@keyframes om-rise-y{0%{transform:scaleY(.45)}50%{transform:scaleY(1)}100%{transform:scaleY(.45)}}\n@keyframes om-dash{to{background-position:12px 0}}\n@keyframes om-tick-row{from{transform:translateX(-56px)}to{transform:translateX(1400px)}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}\n\n/* Omni OS components. Shapes, heights and interactions follow web/src (Bencho blocks); color stays status-only. */\n\n/* ---------- Bencho primitives: hover wash + press ---------- */\n.om-hov{position:relative;isolation:isolate}\n.om-hov::before{content:\"\";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--hov,var(--wash));opacity:0;transform:scale(.72);transition:opacity 160ms,transform 320ms var(--ease-spring)}\n.om-hov:hover::before,.om-hov[data-on=\"true\"]::before{opacity:1;transform:none}\n.om-hov:disabled::before{opacity:0}\n.om-press{transition:transform 220ms var(--ease-settle)}\n.om-press:active:not(:disabled){transform:scale(.96)}\n.om-caption{font:var(--type-caption);color:var(--fg-3)}\n.om-display{font-family:var(--font-head);font-weight:500;letter-spacing:var(--tr-display)}\n\n/* ---------- Button ---------- */\n.om-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h-btn);padding:0 16px;border:0;border-radius:var(--r-pill);font:500 var(--fs-ui)/1 var(--font-sans);white-space:nowrap;user-select:none;cursor:pointer;background:transparent;color:var(--fg);transition:background-color 200ms,color 200ms,opacity 200ms,transform 220ms var(--ease-settle)}\n.om-btn:active:not(:disabled){transform:scale(.96)}\n.om-btn--sm{height:var(--h-btn-sm);padding:0 12px;font-size:var(--fs-small);gap:6px}\n.om-btn--lg{height:var(--h-btn-lg);padding:0 20px;font-size:var(--fs-body)}\n.om-btn--primary{background:var(--fg);color:var(--on-ink)}\n.om-btn--primary:hover{background:color-mix(in srgb,var(--fg) 88%,transparent)}\n.om-btn--primary:disabled{opacity:.35}\n.om-btn--secondary{background:var(--surface-2);color:var(--fg)}\n.om-btn--secondary:hover{background:var(--surface-3)}\n.om-btn--secondary:disabled{opacity:.45}\n.om-btn--ghost{position:relative;isolation:isolate;color:var(--fg-2)}\n.om-btn--ghost::before{content:\"\";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--wash);opacity:0;transform:scale(.72);transition:opacity 160ms,transform 320ms var(--ease-spring)}\n.om-btn--ghost:hover{color:var(--fg)}\n.om-btn--ghost:hover::before{opacity:1;transform:none}\n.om-btn--ghost:disabled{opacity:.4}\n.om-btn--needs{background:var(--needs);color:var(--on-needs)}\n.om-btn--needs:hover{background:color-mix(in srgb,var(--needs) 90%,var(--fg))}\n.om-btn--needs:disabled{opacity:.4}\n.om-btn__kbd{font:400 var(--fs-label)/1 var(--font-num);opacity:.6}\n.om-iconbtn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--h-icon);height:var(--h-icon);padding:0;border:0;border-radius:var(--r-pill);background:transparent;color:var(--fg-3);cursor:pointer;transition:color 160ms,transform 220ms var(--ease-settle)}\n.om-iconbtn::before{content:\"\";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--wash);opacity:0;transform:scale(.72);transition:opacity 160ms,transform 320ms var(--ease-spring)}\n.om-iconbtn:hover,.om-iconbtn[data-on=\"true\"]{color:var(--fg)}\n.om-iconbtn:hover::before,.om-iconbtn[data-on=\"true\"]::before{opacity:1;transform:none}\n.om-iconbtn:active:not(:disabled){transform:scale(.96)}\n.om-iconbtn:disabled{opacity:.4}\n.om-iconbtn--sm{width:28px;height:28px}\n\n/* ---------- Kbd / chips / avatar ---------- */\n.om-kbd{display:inline-grid;place-items:center;height:18px;min-width:18px;padding:0 4px;box-sizing:border-box;border-radius:var(--r-xs);background:var(--surface-2);font:400 var(--fs-label)/1 var(--font-sans);color:var(--fg-3)}\n.om-chip{display:inline-flex;align-items:center;flex:none;height:var(--h-chip);padding:0 8px;border-radius:var(--r-pill);font:500 var(--fs-meta)/1 var(--font-sans);background:var(--surface-2);color:var(--fg-2);white-space:nowrap}\n.om-chip--outline{background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--fg-3)}\n.om-chip--ink{background:var(--fg);color:var(--on-ink)}\n.om-chip--needs{background:var(--needs);color:var(--on-needs)}\n.om-chip--done{background:var(--done);color:var(--on-done)}\n.om-chip--live{background:var(--live);color:var(--on-live)}\n.om-avatar{display:inline-grid;place-items:center;flex:none;border-radius:var(--r-pill);background:var(--surface-2);color:var(--fg-2);font-family:var(--font-rounded);font-weight:500;text-transform:uppercase;line-height:1}\n.om-avatar--ink{background:var(--fg);color:var(--on-ink)}\n.om-tid{font:400 var(--fs-code)/1 var(--font-mono);color:var(--fg-3);white-space:nowrap;text-decoration:none}\na.om-tid:hover,button.om-tid:hover{color:var(--fg)}\nbutton.om-tid{background:none;border:0;padding:0;cursor:pointer}\n.om-crew{flex:none;color:currentColor}\n\n/* ---------- Status ---------- */\n.om-dot{position:relative;display:inline-block;flex:none}\n.om-dot i{position:absolute;inset:0;border-radius:50%}\n.om-dot--running i{background:var(--live)}\n.om-dot--running i.ping{animation:om-ping var(--dur-ping) var(--ease-out) infinite}\n.om-dot--needs i{border-radius:1.5px;background:var(--needs);transform:rotate(45deg) scale(.86)}\n.om-dot--done i{background:var(--done);box-shadow:inset 0 0 0 1px var(--done-edge)}\n.om-dot--settled i{background:var(--fg-4)}\n.om-d -radius:16px;font-size:13px\">rowHover: the wash, at the row's radius<\u002Fdiv><div class=\"rr\" style=\"padding:8px 12px;font-size:13px\">RailRowStyle: wash scales in from .72<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"fields\">\n<h2>Fields<\u002Fh2>\n<p>The field lifts from surface to the page color on focus, with a stronger line and a 4pt wash ring.<\u002Fp>\n<div class=\"grid\">\n<div class=\"spec\"><div class=\"lab\"><b>OmniFieldStyle · FieldLabel<\u002Fb><span>Theme · ScreenStyle<\u002Fspan><\u002Fdiv><div><div class=\"flab\"><b>Name<\u002Fb><\u002Fdiv><input class=\"fld\" placeholder=\"Volero\"><\u002Fdiv><div><div class=\"flab\"><b>Email<\u002Fb><\u002Fdiv><input class=\"fld f\" value=\"ben@askphill.com\"><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>OmniMonoFieldStyle<\u002Fb><em>with hint<\u002Fem><span>ScreenStyle.swift<\u002Fspan><\u002Fdiv><div><div class=\"flab\"><b>Id<\u002Fb><span>Lowercase slug, used in URLs and by the Conductor. Cannot change later.<\u002Fspan><\u002Fdiv><input class=\"fld mono\" placeholder=\"volero\"><\u002Fdiv><div><div class=\"flab\"><b>Port<\u002Fb><\u002Fdiv><input class=\"fld mono\" value=\"4747\" style=\"max-width:140px\"><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>PathField · FieldBox<\u002Fb><span>SettingsView · ScreenStyle<\u002Fspan><\u002Fdiv><div><div class=\"flab\"><b>Repo<\u002Fb><\u002Fdiv><div class=\"stg\" style=\"flex-wrap:nowrap;gap:8px\"><input class=\"fld mono\" value=\"~/code/omni-os\"><button class=\"pb h38\">Choose<\u002Fbutton><\u002Fdiv><\u002Fdiv><div><div class=\"flab\"><b>Scope<\u002Fb><\u002Fdiv><div class=\"fbox\"><span>Global<\u002Fspan><i data-i=\"chevronDown\" data-s=\"13\" style=\"color:var(--fg-3)\"><\u002Fi><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>OmniTextEditor<\u002Fb><em>min 84<\u002Fem><span>ScreenStyle.swift<\u002Fspan><\u002Fdiv><div><div class=\"flab\"><b>Notes<\u002Fb><span>Added to every thread's system prompt in this channel. Keep it short: who the client is, conventions, what not to touch.<\u002Fspan><\u002Fdiv><textarea class=\"fld\">Volero sells bikes in the EU. Prices include VAT. Never touch the checkout.liquid file.<\u002Ftextarea><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>Search field<\u002Fb><em>rest · focused<\u002Fem><span>SearchScreen.swift<\u002Fspan><\u002Fdiv><div class=\"sfield\"><i data-i=\"search\" data-s=\"17\"><\u002Fi><span class=\"f4\">Search threads<\u002Fspan><\u002Fdiv><div class=\"sfield f\"><i data-i=\"search\" data-s=\"17\"><\u002Fi><span>checko<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>SecureField<\u002Fb><em>mono · privacy sensitive<\u002Fem><span>SecretsSettingsView.swift<\u002Fspan><\u002Fdiv><div><div class=\"flab\"><b>Value<\u002Fb><\u002Fdiv><input class=\"fld mono\" type=\"password\" value=\"shpat_0000000000\"><\u002Fdiv><button class=\"pb gh h28\" style=\"align-self:flex-start\"><i data-i=\"key\" data-s=\"12\"><\u002Fi>Use HERMES_API_KEY<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"feedback\">\n<h2>Feedback<\u002Fh2>\n<p>Failures carry the needs diamond and keep the text ink. Loading is the Loader and a fg3 label. Empty states say what to do.<\u002Fp>\n<div class=\"grid\">\n<div class=\"spec\"><div class=\"lab\"><b>ErrorNote<\u002Fb><em>with Retry<\u002Fem><span>ThreadScreen.swift<\u002Fspan><\u002Fdiv><div class=\"en\"><span class=\"g nd\"><\u002Fspan><span>The server did not answer on port 4747.<\u002Fspan><button class=\"pb h26\">Retry<\u002Fbutton><\u002Fdiv><div class=\"en\"><span class=\"g nd\"><\u002Fspan><span>That SVG is too big: keep it under 20 KB.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>NeedsNote · DoneNote · LoadingNote<\u002Fb><span>ScreenStyle.swift<\u002Fspan><\u002Fdiv><span class=\"nnote\"><span class=\"g nd\"><\u002Fspan>The relay signed this Mac out. Sign in again to keep syncing.<\u002Fspan><span class=\"dnote\"><span class=\"g dn\"><\u002Fspan>Saved<\u002Fspan><div class=\"ln\" style=\"padding:0 4px\"><i data-ld=\"14\"><\u002Fi>Loading changes<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>WorkingLine · ReconnectingLabel · Spinner<\u002Fb><span>MessageViews · MainWindow<\u002Fspan><\u002Fdiv><div class=\"wl\"><span class=\"f3\"><i data-ld=\"13\"><\u002Fi><\u002Fspan>Running npm test in the worktree<\u002Fdiv><span class=\"rcl\" style=\"padding:0\"><span class=\"g run g6\"><\u002Fspan>Reconnecting<\u002Fspan><span class=\"lv\"><i data-ld=\"12\"><\u002Fi><\u002Fspan><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>OmniPageHeader<\u002Fb><em>eyebrow · title · subtitle · actions<\u002Fem><span>ScreenStyle.swift<\u002Fspan><\u002Fdiv><div class=\"ph\"><div><div class=\"cap\" style=\"padding-bottom:10px\">Workspace<\u002Fdiv><h3>Automations<\u002Fh3><p>Scheduled prompts. Each run becomes a thread in its channel. Definitions live in automations/*.yaml and reload on save.<\u002Fp><\u002Fdiv><button class=\"pb gh h28\" aria-label=\"Refresh\"><i data-i=\"refresh\" data-s=\"14\"><\u002Fi><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>EmptyNote · RoutePlaceholder<\u002Fb><span>ThreadListViews · MainWindow<\u002Fspan><\u002Fdiv><div class=\"emp\" style=\"padding:24px\"><i><i data-i=\"message\" data-s=\"19\"><\u002Fi><\u002Fi><b>No threads in this channel yet<\u002Fb><p>Start one above. Crew threads delegated by the Conductor land here too.<\u002Fp><\u002Fdiv><div class=\"emp\" style=\"padding:16px 24px\"><i><i data-i=\"home\" data-s=\"19\"><\u002Fi><\u002Fi><b>Nothing here<\u002Fb><p>Nothing lives at #/c/volero/prs/9.<\u002Fp><div class=\"a\"><button class=\"pb\">Go Home<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>NewActivityPill · NewBadge · CopyableMessage<\u002Fb><span>ThreadScreen · ArtifactsScr ><\u002Fi><\u002Fbutton><button class=\"send\"><i data-i=\"send\" data-s=\"16\" data-w=\"2\"><\u002Fi><\u002Fbutton><button class=\"send\" style=\"opacity:.25\"><i data-ld=\"16\"><\u002Fi><\u002Fbutton><span class=\"steer\"><span><i data-i=\"send\" data-s=\"16\" data-w=\"2\"><\u002Fi>Steer<\u002Fspan><i><\u002Fi><b><i data-i=\"chevronDown\" data-s=\"13\"><\u002Fi><\u002Fb><\u002Fspan><span class=\"steer\"><span><i data-i=\"clock\" data-s=\"16\" data-w=\"2\"><\u002Fi>Queue<\u002Fspan><i><\u002Fi><b><i data-i=\"chevronDown\" data-s=\"13\"><\u002Fi><\u002Fb><\u002Fspan><\u002Fdiv>\n<div class=\"nmenu\"><div>Steer now<\u002Fdiv><div>Queue for after this turn<\u002Fdiv><div>Interrupt and send<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>ComposerShell<\u002Fb><em>drag over<\u002Fem><span>ComposerStyle.swift<\u002Fspan><\u002Fdiv><div class=\"cs f\"><div class=\"cs-t\">Here are the screenshots.<\u002Fdiv><div class=\"cs-f\"><button class=\"ib\"><i data-i=\"paperclip\" data-s=\"15\"><\u002Fi><\u002Fbutton><span class=\"cs-tail\"><button class=\"send\"><i data-i=\"send\" data-s=\"16\" data-w=\"2\"><\u002Fi><\u002Fbutton><\u002Fspan><\u002Fdiv><div class=\"cs-over\"><i data-i=\"paperclip\" data-s=\"15\"><\u002Fi>Drop to attach<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec w\"><div class=\"lab\"><b>NewThreadComposerView<\u002Fb><em>big on Home: 16pt text, 96–360 tall · role charter inside<\u002Fem><span>NewThreadView.swift<\u002Fspan><\u002Fdiv>\n<div class=\"cs\"><div class=\"cs-t big\" contenteditable=\"true\" data-ph=\"Ask the Conductor anything. It delegates to the crew.\"><\u002Fdiv><div class=\"cs-f\"><button class=\"pk\"><span class=\"ld24\"><i data-i=\"target\" data-s=\"14\"><\u002Fi><\u002Fspan>Conductor<i data-i=\"chevronDown\" data-s=\"13\"><\u002Fi><\u002Fbutton><button class=\"pk\"><span class=\"pav bg\"><i data-mk=\"13\" data-ring=\"\"><\u002Fi><\u002Fspan>Conductor<i data-i=\"chevronDown\" data-s=\"13\"><\u002Fi><\u002Fbutton px;font:12.5px var(--sans);color:var(--fg-3)\"><span class=\"av\" style=\"width:22px;height:22px;font:500 10.5px var(--sans)\">M<\u002Fspan><b style=\"font-weight:500;color:var(--fg-2)\">maartje<\u002Fb><span class=\"chip d\">approved<\u002Fspan><span style=\"margin-left:auto;font-size:11px;color:var(--fg-4)\">1h ago<\u002Fspan><\u002Fdiv><div class=\"md\" style=\"font-size:14px\">Looks right. Ship it before Friday.<\u002Fdiv><\u002Fdiv>\n<div class=\"ccard\"><div class=\"ckr\"><span class=\"w\"><span class=\"g dn g7\"><\u002Fspan><\u002Fspan><span>theme-check<\u002Fspan><span style=\"font:11px var(--sans);color:var(--fg-3)\">success<\u002Fspan><button class=\"ib z26\"><i data-i=\"external\" data-s=\"13\"><\u002Fi><\u002Fbutton><\u002Fdiv><div class=\"ckr\"><span class=\"w\"><span class=\"g run g7\"><\u002Fspan><\u002Fspan><span>lighthouse<\u002Fspan><span style=\"font:11px var(--sans);color:var(--live)\">in progress<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"ccard\"><div class=\"fr36\"><i data-i=\"file\" data-s=\"13\" style=\"color:var(--fg-4)\"><\u002Fi><span class=\"mono\">snippets/shipping-rates.liquid<\u002Fspan><span class=\"chg\"><span>+2<\u002Fspan><span>-2<\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"fr36\"><i data-i=\"file\" data-s=\"13\" style=\"color:var(--fg-4)\"><\u002Fi><span class=\"mono\">tests/rates.test.ts<\u002Fspan><span class=\"chg\"><span>+2<\u002Fspan><span>-0<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:10px;align-items:baseline;padding:12px 16px;border-radius:20px;background:var(--surface);font:13px var(--sans)\"><span class=\"g dn g9\"><\u002Fspan>Merged. Deleted branch omni/t-4f2b.<\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>MergeSheet<\u002Fb><em>sheet 460 · Return does not confirm<\u002Fem><span>PullRequestDetailView.swift<\u002Fspan><\u002Fdiv><div style=\"padding:24px;border-radius:14px;background:var(--bg);box-shadow:var(--m-menu);display:grid;gap:14px;max-width:460px\"><span style=\"font:500 17px var(--sans)\">Merge #128<\u002Fspan><span style=\"font:12.5px/1.5 var(--sans);color:var(--fg-3)\"><span class=\"mono\" style=\"font-size:12px\">omni/t-4f2b<\u002Fspan> into <span class=\"mono\" style=\"font-size:12px\">main<\u002Fspan> on <span class=\"mono\" style=\"font-size:12px\">askphill/apa-volero<\u002Fspan>, then the branch is deleted.<\u002Fspan><div class=\"stg\" style=\"gap:6px\"><span class=\"chip n\">1 check failing<\u002Fspan><span class=\"chip n\">Still a draft<\u002Fspan><\u002Fdiv><div><div class=\"flab\"><b>Method<\u002Fb><span>One commit on the base branch<\u002Fspan><\u002Fdiv><div class=\"seg sm\"><button class=\"on\">Squash and merge<\u002Fbutton><button>Merge commit<\u002Fbutton><button>Rebase and merge<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"stg\"><button class=\"tg on\" aria-label=\"Delete branch after merge\"><\u002Fbutton><span style=\"font:13px var(--sans);color:var(--fg-2)\">Delete branch after merge<\u002Fspan><\u002Fdiv><span style=\"font:12px var(--sans);color:var(--fg-3)\">Runs gh pr merge and cannot be undone from here.<\u002Fspan><div class=\"stg\" style=\"justify-content:flex-end;gap:8px\"><button class=\"pb gh h34\">Cancel<\u002Fbutton><button class=\"pb p h34\">Merge<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"automations\">\n<h2>Automations<\u002Fh2>\n<p>AutomationsView.swift: one surface card per YAML definition. No create or edit here; they reload on save.<\u002Fp>\n<div class=\"grid\" style=\"--min:520px\"><div class=\"spec w\"><div class=\"lab\"><b>AutomationSection · Badge · RunStrip · RunRow<\u002Fb><span>AutomationsView.swift<\u002Fspan><\u002Fdiv>\n<div class=\"aut\"><div class=\"aut-h\"><span class=\"z\"><i data-i=\"zap\" data-s=\"16\"><\u002Fi><\u002Fspan><div><h5>Weekly store health<\u002Fh5><div class=\"achips\"><span title=\"Every Monday at 09:00\"><i data-i=\"clock\" data-s=\"12\"><\u002Fi>Mondays at 09:00<\u002Fspan><span class=\"cr\">0 9 * * 1<\u002Fspan><span>#Conductor<\u002Fspan><span>conductor<\u002Fspan><span style=\"font-size:11px\">opus-4-1<\u002Fspan><\u002Fdiv><div class=\"nrun\">Next run <b>Mon 09:00<\u002Fb> (Europe/Amsterdam)<\u002Fdiv><\u002Fdiv><div class=\"stg\" style=\"flex-wrap:nowrap\"><button class=\"pb h28\"><i data-i=\"play\" data-s=\"14\"><\u002Fi>Run now<\u002Fbutton><button class=\"tg on\" aria-label=\"Pause automation\"><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"disc\" style=\"padding:0 10px 4px\"><div class=\"ptog\"><i class=\"chev\" data-i=\"chevronRight\" data-s=\"12\"><\u002Fi>Prompt<\u002Fdiv><div class=\"db pbody\">Check every client store's checkout, discounts and theme errors. Report what needs Ben, by store.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:8px 20px 16px;display:grid;gap:8px\"><div class=\"stg\" style=\"gap:12px\"><span class=\"cap\">Last runs<\u002Fspan><span class=\"rstrip\"><i style=\"background:var(--done)\"><\u002Fi><i style=\"background:var(--done)\"><\u002Fi><i class=\"t\" style=\"background:var(--needs)\"><\u002Fi><i style=\"background:var(--done)\"><\u002Fi><i style=\"background:var(--fg-4)\"><\u002Fi><i class=\"t run\" style=\"background:var(--live)\"><\u002Fi><\u002Fspan><\u002Fdiv><div style=\"margin:0 -8px\"><div class=\"rrow\"><span class=\"g run g7\"><\u002Fspan><span>Weekly store health<\u002Fspan><time>now<\u002Ftime><\u002Fdiv><div class=\"rrow\"><span class=\"g dn g7\"><\u002Fspan><span>Weekly store health<\u002Fspan><span style=\"font:10.5px var(--sans);color:var(--fg-4)\">manual<\u002Fspan><time>3d ago<\u002Ftime><\u002Fdiv><div class=\"rrow f3\"><span class=\"g nd g7\"><\u002Fspan><span>Thread removed<\u002Fspan><time>2 weeks ago<\u002Ftime><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"aut bad\"><div class=\"aut-h\"><span class=\"z\"><i data-i=\"zap\" data-s=\"16\" style=\"color:var(--fg-4)\"><\u002Fi><\u002Fspan><div><h5>Nightly theme check <span class=\"chip n\">Invalid<\u002Fspan><\u002Fh5><div class=\"achips\"><span class=\"cr\">0 3 * *<\u002Fspan><span>#Volero<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"stg\" style=\"flex-wrap:nowrap\"><button class=\"pb h28\" disabled=\"\"><i data-i=\"play\" data-s=\"14\"><\u002Fi>Run now<\u002Fbutton><button class=\"tg\" disabled=\"\" aria-label=\"Enable automation\"><\u002Fbutton><\u002Fdiv><\u002Fdiv><div style=\"padding:0 20px 16px\"><div class=\"en\"><span class=\"g nd\"><\u002Fspan><span>cron needs five fields: “0 3 * *” has four.<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"padding:0 20px 16px;font:12.5px var(--sans);color:var(--fg-4)\">Never run.<\u002Fdiv><\u002Fdiv>\n<div class=\"stg\"><span class=\"chip o\">Paused<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"settings\">\n<h2>Settings<\u002Fh2>\n<p>The Settings window (SettingsView.swift) has five toolbar tabs at 560 wide. Pages are a scrolling column of line-ring cards. Channel settings use the same parts inside the channel.<\u002Fp>\n<div class=\"grid\" style=\"--min:460px\">\n<div class=\"spec\"><div class=\"lab\"><b>SettingsView · ConnectionSettings<\u002Fb><span>SettingsView.swift<\u002Fspan><\u002Fdiv><div style=\"border-radius:14px;overflow:hidden;box-shadow:var(--m-menu)\"><div class=\"stabs\"><span class=\"on\"><i data-i=\"globe\" data-s=\"16\"><\u002Fi>Connection<\u002Fspan><span><i data-i=\"key\" data-s=\"16\"><\u002Fi>Secrets<\u002Fspan><span><i data-i=\"refresh\" data-s=\"16\"><\u002Fi>Sync<\u002Fspan><span><i data-i=\"bell\" data-s=\"16\"><\u002Fi>Notifications<\u002Fspan><span><i data-i=\"sun\" data-s=\"16\"><\u002Fi>Appearance<\u002Fspan><\u002Fdiv>\n<div class=\"spage\"><div class=\"scard\"><div class=\"scard-h\"><div><h4>Server<\u002Fh4><p>The app looks for the server on this port and starts it from this repo. Leave Node empty to use the newest Node 24 or later it finds.<\u002Fp><\u002Fdiv><\u002Fdiv><div><div class=\"flab\"><b>Port<\u002Fb><\u002Fdiv><input class=\"fld mono\" value=\"4747\" style=\"max-width:140px\"><\u002Fdiv><div><div class=\"flab\"><b>Node<\u002Fb><\u002Fdiv><div class=\"stg\" style=\"flex-wrap:nowrap;gap:8px\"><input class=\"fld mono\" placeholder=\"Detect automatically\"><button class=\"pb h38\">Choose<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"stg\" style=\"padding:10px 14px;border-radius:16px;background:var(--surface);gap:8px;font:12.5px var(--sans);color:var(--fg-2)\"><i data-i=\"info\" data-s=\"13\" style=\"color:var(--fg-3)\"><\u002Fi>Launch arguments set these values, so changes last until the app quits.<\u002Fdiv><\u002Fdiv>\n<div class=\"scard\"><div class=\"scard-h\"><div><h4>Status<\u002Fh4><\u002Fdiv><\u002Fdiv><div class=\"irows\"><div class=\"irow\"><span>Server<\u002Fspan><span>Running<\u002Fspan><\u002Fdiv><div class=\"irow\"><span>Feed<\u002Fspan><span>Connected<\u002Fspan><\u002Fdiv><div class=\"irow\"><span>Log<\u002Fspan><span><button class=\"pb h26\">Open Log<\u002Fbutton><\u002Fspan><\u002Fdiv><div class=\"irow\"><span>Build<\u002Fspan><span class=\"mono f2\" style=\"font-size:12px\">20dfb9977517<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>NotificationSettingsView · SettingsIntro · SettingsToggle · ChannelAlertToggle<\u002Fb><span>NotificationSettingsView.swift<\u002Fspan><\u002Fdiv><div class=\"spage\" style=\"padding:0\"><div class=\"sintro\"><span><i data-i=\"bell\" data-s=\"15\"><\u002Fi><\u002Fspan><div>This Mac can tell you when a thread finishes or fails while you are somewhere else. Click a notification to open its thread. Nothing alerts for the thread you are looking at, and these choices stay on this Mac.<\u002Fdiv><\u002Fdiv>\n<div class=\"scard\"><div class=\"scard-h\"><div><h4>Notifications<\u002Fh4><\u002Fdiv><\u002Fdiv><div class=\"stog\"><div><b>Notify on this Mac<\u002Fb><span>New finished and failed results, the ones Needs you lists. Turning this on asks macOS the first time.<\u002Fspan><\u002Fdiv><button class=\"tg on\" aria-label=\"Notify on this Mac\"><\u002Fbutton><\u002Fdiv><div class=\"irows\"><div class=\"irow\"><span>macOS<\u002Fspan><span><span class=\"g nd g7\"><\u002Fspan>Off in System Settings<span style=\"flex:1\"><\u002Fspan><button class=\"pb h26\">Open System Settings<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"en\"><span class=\"g nd\"><\u002Fspan><span>macOS has notifications off for Omni. Turn them on in System Settings, Notifications, Omni.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"scard\"><div class=\"scard-h\"><div><h4>Channels<\u002Fh4><p>A channel turned off still lists its results in Needs you, without a notification.<\u002Fp><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:16px;background:var(--surface)\"><div style=\"flex:1;display:grid;gap:1px\"><b style=\"font:500 13px var(--sans)\">Volero<\u002Fb><span class=\"mono f3\" style=\"font-size:11.5px\">#volero<\u002Fspan><\u002Fdiv><button class=\"tg on\" aria-label=\"Notify for Volero\"><\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>SecretsForm · SecretRowView<\u002Fb><span>SecretsSettingsView.swift<\u002Fspan><\u002Fdiv><div class=\"spage\" style=\"padding:0\"><div class=\"scard\"><div class=\"scard-h\"><div><h4>Add or replace<\u002Fh4><\u002Fdiv><\u002Fdiv><div><div class=\"flab\"><b>Scope<\u002Fb><\u002Fdiv><div class=\"fbox\"><span>#volero<\u002Fspan><i data-i=\"chevronDown\" data-s=\"13\" style=\"color:var(--fg-3)\"><\u002Fi><\u002Fdiv><\u002Fdiv><div><div class=\"flab\"><b>Name<\u002Fb><\u002Fdiv><input class=\"fld mono\" placeholder=\"SHOPIFY_ADMIN_TOKEN\"><\u002Fdiv><div class=\"stg\"><button class=\"pb p h34\">Save<\u002Fbutton><span class=\"dnote\"><span class=\"g dn\"><\u002Fspan>Saved<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;gap:6px\"><span class=\"cap\" style=\"padding:0 12px;display:flex;gap:6px\">#volero<span class=\"f4\">2<\u002Fspan><\u002Fspan><div class=\"hw\" style=\"display:flex;align-items:center;gap:10px;padding:6px 12px\"><i data-i=\"key\" data-s=\"14\" style=\"color:var(--fg-3)\"><\u002Fi><span class=\"mono\" style=\"flex:1;font-size:12.5px\">SHOPIFY_ADMIN_TOKEN<\u002Fspan><span style=\"font:12px var(--sans);color:var(--fg-4)\">3d ago<\u002Fspan><button class=\"ib z28\"><i data-i=\"trash\" data-s=\"14\"><\u002Fi><\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>SyncForm<\u002Fb><em>status · sign in · path map<\u002Fem><span>SyncSettingsView.swift<\u002Fspan><\u002Fdiv><div class=\"spage\" style=\"padding:0\"><div class=\"scard\"><div class=\"scard-h\"><div><h4>Status<\u002Fh4><\u002Fdiv><button class=\"pb gh h28\">Pause<\u002Fbutton><button class=\"pb p h28\">Sync Now<\u002Fbutton><\u002Fdiv><div class=\"irows\"><div class=\"irow\"><span>Status<\u002Fspan><span><span class=\"g dn g7\"><\u002Fspan>Up to date<\u002Fspan><\u002Fdiv><div class=\"irow\"><span>Last sync<\u002Fspan><span>2m ago<\u002Fspan><\u002Fdiv><div class=\"irow\"><span>To push<\u002Fspan><span>3 (1 held)<\u002Fspan><\u002Fdiv><div class=\"irow\"><span>This Mac<\u002Fspan><span><span class=\"mono\" style=\"font-size:12px\">mbp-ben-7f3a<\u002Fspan><button class=\"ib z26\"><i data-i=\"copy\" data-s=\"13\"><\u002Fi><\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"stg\" style=\"flex-wrap:nowrap;align-items:baseline\"><span style=\"flex:1;font:12px var(--sans);color:var(--fg-3)\">Signing out removes the credentials from the Keychain. History stays on this Mac.<\u002Fspan><button class=\"pb h28\">Sign Out<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"scard\"><div class=\"scard-h\"><div><h4>Path map<\u002Fh4><p>Paths travel with your home folder as ~. When the other Mac keeps a folder somewhere else, map it here.<\u002Fp><\u002Fdiv><\u002Fdiv><div class=\"stg\" style=\"flex-wrap:nowrap;gap:8px\"><input class=\"fld mono\" value=\"~/work\"><i data-i=\"arrowRight\" data-s=\"14\" style=\"color:var(--fg-4)\"><\u002Fi><input class=\"fld mono\" value=\"~/code\"><button class=\"ib\"><i data-i=\"trash\" data-s=\"14\"><\u002Fi><\u002Fbutton><\u002Fdiv><div class=\"stg\"><button class=\"pb h30\" style=\"height:32px\"><i data-i=\"plus\" data-s=\"13\"><\u002Fi>Add Mapping<\u002Fbutton><button class=\"pb p\">Save<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>ChannelSettingsForm · SettingsSection · GlyphPicker<\u002Fb><span>ChannelSettingsView.swift<\u002Fspan><\u002Fdiv><div class=\"scard\" style=\"gap:16px\"><h4 style=\"margin:0;font:500 16px var(--sans);letter-spacing:-.16px\">Basics<\u002Fh4><div><div class=\"flab\"><b>Icon<\u002Fb><span>Shown in the sidebar and on the channel. Type an emoji, upload an SVG or pick an icon. Empty uses the first letter.<\u002Fspan><\u002Fdiv><div class=\"stg\" style=\"gap:12px\"><span class=\"av\" style=\"width:36px;height:36px\"><i data-i=\"zap\" data-s=\"18\"><\u002Fi><\u002Fspan><input class=\"fld\" placeholder=\"Emoji\" style=\"width:96px;text-align:center;font-size:18px;padding:5px\"><button class=\"pb h30\"><i data-i=\"image\" data-s=\"14\"><\u002Fi>Upload SVG<\u002Fbutton><button class=\"pb h30\">Clear<\u002Fbutton><\u002Fdiv><div class=\"gpick\" style=\"margin-top:12px\"><button><i data-i=\"home\" data-s=\"17\"><\u002Fi><\u002Fbutton><button class=\"on\"><i data-i=\"zap\" data-s=\"17\"><\u002Fi><\u002Fbutton><button><i data-i=\"globe\" data-s=\"17\"><\u002Fi><\u002Fbutton><button><i data-i=\"layers\" data-s=\"17\"><\u002Fi><\u002Fbutton><button><i data-i=\"image\" data-s=\"17\"><\u002Fi><\u002Fbutton><button><i data-i=\"key\" data-s=\"17\"><\u002Fi><\u002Fbutton><button><i data-i=\"bell\" data-s=\"17\"><\u002Fi><\u002Fbutton><button><i data-i=\"target\" data-s=\"17\"><\u002Fi><\u002Fbutton><\u002Fdiv><\u002Fdiv><div><div class=\"flab\"><b>Kind<\u002Fb><\u002Fdiv><div class=\"seg\"><button class=\"on\">Client<\u002Fbutton><button>Internal<\u002Fbutton><button>Personal<\u002Fbutton><\u002Fdiv><\u002Fdiv><div><div class=\"flab\"><b>Default model<\u002Fb><span>What a new thread here starts on. A thread or crew role that picks its own wins.<\u002Fspan><\u002Fdiv><div class=\"stg\" style=\"gap:6px\"><button class=\"pk\"><span class=\"pav bg\"><i data-h=\"claude\" data-s=\"13\"><\u002Fi><\u002Fspan>Claude Code default<i data-i=\"chevronDown\" data-s=\"13\"><\u002Fi><\u002Fbutton><button class=\"pk\"><span class=\"ld24\"><i data-i=\"sliders\" data-s=\"14\"><\u002Fi><\u002Fspan>Default<i data-i=\"chevronDown\" data-s=\"13\"><\u002Fi><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"stog\"><div><b>Worktree per thread<\u002Fb><span>Each thread gets its own branch (omni/...) so parallel work never collides. Off runs in the repo itself.<\u002Fspan><\u002Fdiv><button class=\"tg on\" aria-label=\"Worktree per thread\"><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"stg\"><button class=\"pb p h34\">Save changes<\u002Fbutton><span class=\"dnote\"><span class=\"g dn\"><\u002Fspan>Saved<\u002Fspan><span style=\"flex:1\"><\u002Fspan><button class=\"pb gh h34\">Cancel<\u002Fbutton><button class=\"pb n h34\">Archive<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>AppearanceSettingsView<\u002Fb><em>native grouped Form<\u002Fem><span>AppearanceSettingsView.swift<\u002Fspan><\u002Fdiv><div class=\"nform\"><div><span>Appearance<\u002Fspan><span class=\"stg\" style=\"gap:12px\"><span class=\"radio on\"><i><\u002Fi>Match system<\u002Fspan><span class=\"radio\"><i><\u002Fi>Light<\u002Fspan><span class=\"radio\"><i><\u002Fi>Dark<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><p>Applies to every Omni window at once.<\u002Fp><div class=\"nform\"><div><span>Zoom<\u002Fspan><span class=\"fbox\" style=\"padding:3px 10px;font-size:13px;gap:16px\">100%<i data-i=\"chevronDown\" data-s=\"12\"><\u002Fi><\u002Fspan><\u002Fdiv><\u002Fdiv><p>Text, icons and spacing in every window. View › Zoom In (⌘=), Zoom Out (⌘-) and Actual Size (⌘0) change it too.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"server\">\n<h2>Server and updates<\u002Fh2>\n<p>ServerView.swift stands in for the route while there is no server; UpdateViews.swift puts bars over the pane and banners at its bottom right.<\u002Fp>\n<div class=\"grid\" style=\"--min:460px\">\n<div class=\"spec\"><div class=\"lab\"><b>ServerView · ServerDetails<\u002Fb><em>not running<\u002Fem><span>ServerView.swift<\u002Fspan><\u002Fdiv><div class=\"srvc\"><span class=\"c48\"><i data-i=\"terminal\" data-s=\"20\" data-w=\"1.5\"><\u002Fi><\u002Fspan><div><h5>The Omni server is not running<\u002Fh5><p>Start it here, or run npm start in the repo. It keeps running when the app quits.<\u002Fp><\u002Fdiv><div class=\"irows\" style=\"background:var(--bg);width:100%;text-align:left\"><div class=\"irow\"><span>Port<\u002Fspan><span>4747<\u002Fspan><\u002Fdiv><div class=\"irow\"><span>Repo<\u002Fspan><span class=\"mono\" style=\"font-size:12px\">~/code/omni-os<\u002Fspan><\u002Fdiv><div class=\"irow\"><span>Node<\u002Fspan><span class=\"f3\">Detect automatically<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"stg\" style=\"justify-content:center;gap:8px\"><button class=\"pb p h34\">Start Server<\u002Fbutton><button class=\"pb h34\">Check Again<\u002Fbutton><button class=\"pb gh h34\">Settings<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"stg\" style=\"justify-content:center;flex-direction:column;gap:14px;padding:16px\"><i data-ld=\"22\"><\u002Fi><span style=\"font:13px var(--sans);color:var(--fg-3)\">Looking for the server on port 4747<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>ServerView · LogTail<\u002Fb><em>failed<\u002Fem><span>ServerView.swift<\u002Fspan><\u002Fdiv><div class=\"srvc\" style=\"max-width:640px;gap:16px\"><span class=\"c48\"><span class=\"g nd g14\"><\u002Fspan><\u002Fspan><div><h5>Server problem<\u002Fh5><p class=\"f2\">The server exited with code 1 before it answered.<\u002Fp><\u002Fdiv><div class=\"ltail\"><span class=\"cap\" style=\"padding-left:4px\">Last lines of the log<\u002Fspan><pre>Error: listen EADDRINUSE: address already in use :::4747\n    at Server.setupListenHandle (node:net:1817:16)<\u002Fpre><\u002Fdiv><div class=\"stg\" style=\"justify-content:center;gap:8px\"><button class=\"pb p h34\">Try Again<\u002Fbutton><button class=\"pb h34\">Open Log<\u002Fbutton><button class=\"pb h34\">Stop Server<\u002Fbutton><button class=\"pb gh h34\">Settings<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>UpdateBar<\u002Fb><span>UpdateViews.swift<\u002Fspan><\u002Fdiv><div class=\"ubar\"><span class=\"w\"><i data-i=\"refresh\" data-s=\"14\"><\u002Fi><\u002Fspan><span>The server is behind main.<\u002Fspan><span><button class=\"pb p h26\">Restart<\u002Fbutton><\u002Fspan><\u002Fdiv><div class=\"ubar\"><span class=\"w\"><i data-i=\"download\" data-s=\"14\"><\u002Fi><\u002Fspan><span>This app is behind main.<\u002Fspan><span><button class=\"pb p h26\">Rebuild and Relaunch<\u002Fbutton><\u002Fspan><\u002Fdiv><div class=\"ubar\"><span class=\"w\"><i data-ld=\"14\"><\u002Fi><\u002Fspan><span>Building the Web UI<\u002Fspan><span><button class=\"pb gh h26\">Cancel<\u002Fbutton><\u002Fspan><\u002Fdiv><div class=\"ubar\"><span class=\"w\"><span class=\"g nd\"><\u002Fspan><\u002Fspan><span>The build failed. See the log.<\u002Fspan><span><button class=\"pb h26\">Open Log<\u002Fbutton><button class=\"pb gh h26\">Dismiss<\u002Fbutton><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>BannerStack · BannerView<\u002Fb><em>auto-dismiss 6.5s<\u002Fem><span>UpdateViews.swift<\u002Fspan><\u002Fdiv><div class=\"ban\"><span class=\"g dn g7\"><\u002Fspan><div><b>Funnel before and after<\u002Fb><span>Done in #Volero<\u002Fspan><\u002Fdiv><button class=\"pb p h26\">Open<\u002Fbutton><button class=\"ib z26\"><i data-i=\"x\" data-s=\"13\"><\u002Fi><\u002Fbutton><\u002Fdiv><div class=\"ban\"><span class=\"g nd g7\"><\u002Fspan><div><b>Pause WEEKEND15<\u002Fb><span>Failed in #Volero<\u002Fspan><\u002Fdiv><button class=\"pb p h26\">Open<\u002Fbutton><button class=\"ib z26\"><i data-i=\"x\" data-s=\"13\"><\u002Fi><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\" id=\"native\">\n<h2>Menus and alerts<\u002Fh2>\n<p>System surfaces the app fills with its own words: the menu bar (OmniApp.swift), context menus, and AppKit alerts. These follow macOS, not the Omni tokens.<\u002Fp>\n<div class=\"grid\" style=\"--min:260px\">\n<div class=\"spec\"><div class=\"lab\"><b>Go · Thread · Server<\u002Fb><span>OmniApp · ThreadCommands · ServerView<\u002Fspan><\u002Fdiv><div class=\"nmenu\"><div>Back<em>⌘[<\u002Fem><\u002Fdiv><div class=\"dis\">Forward<em>⌘]<\u002Fem><\u002Fdiv><hr><div>Home<em>⇧⌘H<\u002Fem><\u002Fdiv><div>Go to…<em>⌘K<\u002Fem><\u002Fdiv><div>Search<em>⇧⌘F<\u002Fem><\u002Fdiv><\u002Fdiv><div class=\"nmenu\"><div>Interrupt<em>⌘.<\u002Fem><\u002Fdiv><\u002Fdiv><div class=\"nmenu\"><div class=\"dis\">Port 4747: Running<\u002Fdiv><hr><div class=\"dis\">Start Server<\u002Fdiv><div>Stop Server…<\u002Fdiv><div>Check Again<em>⌘R<\u002Fem><\u002Fdiv><hr><div>Open Log<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>File · Edit · View<\u002Fb><span>OmniApp · ThreadWindow · InspectorView<\u002Fspan><\u002Fdiv><div class=\"nmenu\"><div>New Thread<em>⌘N<\u002Fem><\u002Fdiv><div>Open in New Window<em>⌥⌘N<\u002Fem><\u002Fdiv><\u002Fdiv><div class=\"nmenu\"><div>Copy Thread as Markdown<em>⇧⌘C<\u002Fem><\u002Fdiv><\u002Fdiv><div class=\"nmenu\"><div>Hide Sidebar<em>⌃⌘S<\u002Fem><\u002Fdiv><div>Hide Inspector (4)<em>⌥⌘I<\u002Fem><\u002Fdiv><hr><div>Zoom In<em>⌘=<\u002Fem><\u002Fdiv><div>Zoom Out<em>⌘-<\u002Fem><\u002Fdiv><div>Actual Size<em>⌘0<\u002Fem><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>Context menus<\u002Fb><em>thread · channel · folder<\u002Fem><span>ThreadWindow · SidebarView · SidebarFolders<\u002Fspan><\u002Fdiv><div class=\"nmenu\"><div>Open in New Window<\u002Fdiv><hr><div>Rename Thread...<\u002Fdiv><div>Move to Folder<em>›<\u002Fem><\u002Fdiv><div>Archive Thread<\u002Fdiv><\u002Fdiv><div class=\"nmenu\"><div>Collapse<\u002Fdiv><div>New Folder<\u002Fdiv><div>Channel Settings<\u002Fdiv><\u002Fdiv><div class=\"nmenu\"><div>New Thread Here<\u002Fdiv><hr><div>Rename<\u002Fdiv><div>Duplicate<\u002Fdiv><hr><div class=\"red\">Delete...<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"spec\"><div class=\"lab\"><b>Alerts<\u002Fb><em>NSAlert · confirmation dialogs<\u002Fem><span>ServerView · UpdateViews · SidebarFolders<\u002Fspan><\u002Fdiv><div class=\"nalert\"><b>Stop the Omni server?<\u002Fb><span>Running threads stop too, and the Web UI goes offline until the server starts again.<\u002Fspan><div class=\"bt\"><span class=\"d r\" style=\"background:var(--surface-2)\">Stop Server<\u002Fspan><span class=\"d\">Cancel<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"nalert\"><b>2 turns are still running<\u002Fb><span>Keep the server running in the background to let them finish, or stop them and quit.<\u002Fspan><div class=\"bt\"><span class=\"d\">Keep Server Running<\u002Fspan><span>Stop Them and Quit<\u002Fspan><span>Cancel<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"nalert\"><b>Delete “Checkout”?<\u002Fb><span>The 3 threads inside are not deleted. They move back to the channel's ungrouped list.<\u002Fspan><div class=\"bt\"><span class=\"r\">Delete Folder<\u002Fspan><span class=\"d\">Cancel<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fdiv>\n\n<script src=\"0026596a-5b5d-4bea-a5d5-c401b6b55ff5\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
